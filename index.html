<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>GitHub Command Center — 2 Accounts · Zero Secrets Exposed</title>
<style>
/* ============================================================================
   GHAZI GREENISH · app surface
   Tokens from the house style. Flat and quiet on purpose: no hover lift,
   no glass cards, no gradient borders. Status colours are claims.
   ========================================================================== */
:root {
  color-scheme: dark;
  --bg: #08110f;
  --surface: #101c19;
  --surface-2: #14241f;
  --line: #294039;
  --text: #edf8f3;
  --muted: #a5bdb3;
  --dim: #749286;
  --green: #52e3b9;
  --blue: #72a9ff;
  --orange: #ffbd62;
  --red: #ff7a6b;
  --radius: 14px;
  --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  /* app-only aliases, all resolved to house values */
  --ac: #52e3b9;
  --ac2: #52e3b9;
  --ok: #52e3b9;
  --warn: #ffbd62;
  --bad: #ff7a6b;
  --pur: #72a9ff;
  --cy: #72a9ff;
  --panel: #101c19;
  --panel2: #14241f;
  --bg2: #0b1614;
  --tx: #edf8f3;
  --tx2: #a5bdb3;
  --tx3: #749286;
  --line2: #294039;
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f5faf7; --surface: #fff; --surface-2: #f2f8f4; --line: #ccd8d2;
  --text: #10221c; --muted: #526860; --dim: #6b7d76;
  --green: #0a8f68; --blue: #2c62b8; --orange: #a76a12; --red: #c03a2b;
  --panel: #fff; --panel2: #f2f8f4; --bg2: #eef5f1;
  --tx: #10221c; --tx2: #526860; --tx3: #6b7d76; --line2: #ccd8d2;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--sans); line-height: 1.6; -webkit-font-smoothing: antialiased;
}
a { color: var(--green); }
::selection { background: rgba(82,227,185,.25); }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--line); border-radius: 20px; border: 2px solid transparent; background-clip: padding-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--dim); background-clip: padding-box; }
code, kbd, pre { font-family: var(--mono); }

/* ---------- shell ---------- */
#shell { display: grid; grid-template-columns: 262px 1fr; min-height: 100vh; }
aside {
  border-right: 1px solid var(--line); background: var(--surface);
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
}
.brand { padding: 20px 18px 16px; border-bottom: 1px solid var(--line); }
.brand h1 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
.mark { width: 27px; height: 27px; flex: none; display: inline-flex; align-items: flex-end; gap: 2px; padding: 6px 5px; border: 1px solid #397c68; border-radius: 8px; background: #122b24; }
.mark i { width: 4px; border-radius: 3px 3px 1px 1px; background: var(--green); }
.mark i:nth-child(1) { height: 7px; }
.mark i:nth-child(2) { height: 14px; background: var(--orange); }
.mark i:nth-child(3) { height: 10px; background: var(--blue); }
.brand p { margin: 8px 0 0; font-size: 11px; color: var(--dim); line-height: 1.5; font-family: var(--mono); }
nav { padding: 12px 10px; overflow: auto; flex: 1; }
.navlabel { font: 700 10px var(--mono); letter-spacing: .13em; text-transform: uppercase; color: var(--dim); padding: 14px 10px 7px; }
nav a {
  display: flex; align-items: center; gap: 10px; padding: 8px 11px; color: var(--muted);
  text-decoration: none; font-size: 13.5px; cursor: pointer; border-left: 2px solid transparent; transition: color .12s;
}
nav a:hover { color: var(--text); background: var(--surface-2); }
nav a.on { color: var(--text); border-left-color: var(--green); background: var(--surface-2); font-weight: 600; }
nav a .ic { width: 17px; text-align: center; opacity: .85; }
nav a .pill { margin-left: auto; font: 10px var(--mono); }
.side-foot { padding: 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; }

/* ---------- topbar ---------- */
main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 14px;
  min-height: 68px; padding: 12px 30px; border-bottom: 1px solid var(--line);
  background: rgba(8,17,15,.9); backdrop-filter: blur(14px);
}
html[data-theme="light"] .topbar { background: rgba(245,250,247,.9); }
.topbar h2 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
.topbar .sub { color: var(--dim); font-size: 12px; font-family: var(--mono); }
.spacer { flex: 1; }
.search { position: relative; }
.search input {
  background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 8px;
  padding: 7px 12px 7px 30px; font-size: 13px; width: 250px; outline: none; transition: .14s; font-family: var(--sans);
}
.search input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(82,227,185,.14); width: 300px; }
.search::before { content: "\2315"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 14px; }
.view { padding: 30px; max-width: 1160px; width: 100%; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }

/* ---------- type ---------- */
h1, h2, h3 { margin: 0; line-height: 1.08; letter-spacing: -.045em; }
h3.sec {
  margin: 34px 0 16px; font-size: 1.12rem; font-weight: 800;
  display: flex; align-items: center; gap: 10px;
}
h3.sec:first-child { margin-top: 0; }
h3.sec .bar { width: 3px; height: 15px; background: var(--green); border-radius: 3px; flex: none; }
h4 { margin: 0 0 6px; font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .tiny { font-size: 12.5px; } .mono { font-family: var(--mono); }
.eyebrow { margin: 0 0 16px; color: var(--green); font: 700 11px var(--mono); letter-spacing: .13em; text-transform: uppercase; }
.eyebrow.orange { color: var(--orange); }
.fine { margin: 16px 0 0; color: var(--dim); font: 11px var(--mono); }
.section-head { display: grid; grid-template-columns: 1fr minmax(260px,.65fr); gap: 50px; align-items: end; margin-bottom: 22px; }
.section-head > p { margin: 0; color: var(--muted); font-size: 14px; }

/* ---------- hero ---------- */
.hero {
  padding: 56px 0 44px; margin-bottom: 30px; border-bottom: 1px solid var(--line);
  background: radial-gradient(circle at 82% 15%, rgba(82,227,185,.10), transparent 34%),
              radial-gradient(circle at 8% 20%, rgba(114,169,255,.07), transparent 30%);
}
.hero h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); max-width: 760px; }
.hero h1 span { color: var(--orange); }
.lede { max-width: 700px; margin: 22px 0 0; color: var(--muted); font-size: 1.05rem; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }

/* ---------- surfaces ---------- */
.card { padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.card.pad0 { padding: 0; overflow: hidden; }
.card .label { display: inline-flex; margin-bottom: 13px; color: var(--green); font: 700 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.card .label.preview { color: var(--orange); }
.card .label.planned { color: var(--blue); }
.card .label.blocked { color: var(--red); }
.evidence { margin-top: 12px; color: var(--dim); font: 10px var(--mono); }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* ---------- status vocabulary ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px;
  border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font: 10px var(--mono);
  letter-spacing: .05em; text-transform: uppercase;
}
.pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex: none; }
.pill.ok::before { background: var(--green); }
.pill.warn { color: var(--orange); } .pill.warn::before { background: var(--orange); }
.pill.bad { color: var(--red); } .pill.bad::before { background: var(--red); }
.pill.ac { color: var(--blue); } .pill.ac::before { background: var(--blue); }
.pill.pur { color: var(--blue); } .pill.pur::before { background: var(--blue); }
.st { display: inline-flex; padding: 2px 7px; border-radius: 999px; font: 700 9px var(--mono); letter-spacing: .07em; text-transform: uppercase; border: 1px solid; }
.st.live { color: var(--green); border-color: #397c68; }
.st.preview { color: var(--orange); border-color: #7b5b2b; }
.st.planned { color: var(--blue); border-color: #3d5e8e; }
.st.none { color: var(--dim); border-color: var(--line); }

/* ---------- buttons (flat, 8px, weight 800) ---------- */
button, .btn {
  font-family: var(--sans); font-size: 13px; font-weight: 700; cursor: pointer;
  min-height: 38px; padding: 8px 14px; border-radius: 8px;
  background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
  transition: border-color .12s, color .12s; display: inline-flex; align-items: center; gap: 7px;
}
button:hover, .btn:hover { border-color: var(--green); color: var(--green); }
button.pri { background: var(--green); border-color: var(--green); color: #061710; font-weight: 800; }
button.pri:hover { filter: brightness(1.08); color: #061710; }
button.good { background: rgba(82,227,185,.1); border-color: #2e6e5c; color: var(--green); }
button.danger { background: rgba(255,122,107,.08); border-color: #8a3a30; color: var(--red); }
button.danger:hover { border-color: var(--red); color: var(--red); }
button.ghost { background: transparent; }
button.sm { min-height: 29px; padding: 4px 10px; font-size: 12px; border-radius: 7px; }
button:disabled { opacity: .45; cursor: not-allowed; }
.mini { min-height: 26px; padding: 3px 9px; font-size: 11px; font-family: var(--mono); font-weight: 700; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.mini:hover { border-color: var(--green); color: var(--green); }

/* ---------- forms ---------- */
input, select, textarea {
  font-family: var(--sans); font-size: 14px; background: var(--bg2); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; outline: none; width: 100%; transition: .14s;
}
input:focus, select:focus, textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(82,227,185,.14); }
textarea { font-family: var(--mono); font-size: 13px; line-height: 1.7; resize: vertical; }
label.fl { display: block; color: var(--dim); font: 700 10px var(--mono); letter-spacing: .09em; text-transform: uppercase; margin-bottom: 6px; }
.field { min-width: 0; }

/* ---------- code ---------- */
pre {
  background: #06110f; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
  overflow: auto; font-size: 12.5px; line-height: 1.75; margin: 0; color: #cde8dd;
}
html[data-theme="light"] pre { background: #0b1614; color: #d7ece2; }
pre .c { color: var(--dim); font-style: italic; }
pre .k { color: var(--orange); }
pre .s { color: var(--green); }
pre .v { color: var(--blue); }
.codewrap { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.codewrap .bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.codewrap .bar .lbl { color: var(--dim); font: 700 10px var(--mono); letter-spacing: .09em; text-transform: uppercase; }
.codewrap pre { border: 0; border-radius: 0; }
.codewrap .bar .spacer { flex: 1; }
.kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; font: 11px var(--mono); color: var(--muted); }
.tree { font-family: var(--mono); font-size: 12.5px; line-height: 1.85; white-space: pre; overflow: auto; }

/* ---------- callouts ---------- */
.note { padding: 15px 17px; border: 1px solid #3d5e8e; border-radius: 12px; background: rgba(114,169,255,.06); color: var(--muted); font-size: 13.5px; }
.note b, .note strong { color: var(--blue); }
.note.warn { border-color: #7b5b2b; background: rgba(255,189,98,.07); }
.note.warn b, .note.warn strong { color: var(--orange); }
.note.bad { border-color: #8a3a30; background: rgba(255,122,107,.06); }
.note.bad b, .note.bad strong { color: var(--red); }
.note.good { border-color: #2e6e5c; background: rgba(82,227,185,.05); }
.note.good b, .note.good strong { color: var(--green); }
.callout { padding: 24px 26px; border: 1px solid #7b5b2b; border-radius: var(--radius); background: rgba(255,189,98,.07); }
.callout strong { color: var(--orange); }
.callout p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }

/* ---------- lists ---------- */
ul.ticks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
ul.ticks li { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; color: var(--muted); }
ul.ticks li::before { content: "\2192"; color: var(--green); font-family: var(--mono); flex: none; }
ol.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
ol.steps > li { counter-increment: s; position: relative; padding-left: 36px; font-size: 14px; color: var(--muted); }
ol.steps > li::before {
  content: counter(s); position: absolute; left: 0; top: 1px; width: 24px; height: 24px; border-radius: 50%;
  background: transparent; border: 1px solid var(--line); color: var(--orange); font: 700 11px var(--mono);
  display: grid; place-items: center;
}

/* ---------- stats ---------- */
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 15px 17px; background: var(--surface); }
.stat .n { color: var(--orange); font: 800 1.7rem var(--mono); letter-spacing: -.05em; }
.stat .l { color: var(--dim); font: 700 10px var(--mono); letter-spacing: .09em; text-transform: uppercase; }
.stat .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.progressbar { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.progressbar > div { height: 100%; background: linear-gradient(90deg, #2e6e5c, var(--green)); }

/* ---------- lessons ---------- */
.lesson { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.lesson .head { display: flex; gap: 14px; align-items: center; padding: 16px 20px; cursor: pointer; user-select: none; transition: background .12s; }
.lesson .head:hover { background: var(--surface-2); }
.lesson .num { width: 34px; height: 34px; flex: none; border: 1px solid var(--line); border-radius: 10px; display: grid; place-items: center; font: 700 13px var(--mono); color: var(--dim); background: var(--surface-2); }
.lesson.done .num { border-color: #2e6e5c; color: var(--green); }
.lesson .t { font-weight: 700; font-size: 14.5px; }
.lesson .d { font-size: 12.5px; color: var(--dim); }
.lesson .body { padding: 4px 20px 20px; border-top: 1px solid var(--line); display: none; }
.lesson.open .body { display: block; animation: fade .15s; }
.lesson .body > * { margin-top: 16px; }
.step { border-left: 2px solid var(--line); padding-left: 16px; position: relative; }
.step::before { content: ""; position: absolute; left: -5px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.step h4 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step .why { font-size: 13px; color: var(--muted); margin: 0 0 9px; }
.quiz { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: var(--surface-2); }
.quiz .q { font-weight: 700; font-size: 14px; margin-bottom: 12px; }
.quiz button { display: flex; width: 100%; text-align: left; margin-bottom: 7px; font-weight: 500; justify-content: flex-start; }
.quiz button.correct { border-color: var(--green); color: var(--green); background: rgba(82,227,185,.08); }
.quiz button.wrong { border-color: var(--red); color: var(--red); background: rgba(255,122,107,.06); }
.expl-out { margin-top: 8px; padding: 11px 13px; border-radius: 8px; background: var(--bg2); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }

/* ---------- repos ---------- */
.repo { border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; background: var(--surface); display: flex; flex-direction: column; gap: 11px; }
.repo .rtop { display: flex; gap: 12px; align-items: flex-start; }
.repo .avatar { width: 38px; height: 38px; flex: none; border-radius: 10px; display: grid; place-items: center; font: 800 13px var(--mono); color: #061710; }
.repo .rn { font-weight: 700; font-size: 15px; word-break: break-all; }
.repo .rp { font-size: 11.5px; color: var(--dim); font-family: var(--mono); word-break: break-all; }
.repo .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 11px var(--mono); padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); cursor: pointer; }
.chip:hover { border-color: var(--green); color: var(--green); }
.chip.on { border-color: var(--green); color: var(--green); }

/* ---------- scanner ---------- */
.drop { border: 1px dashed var(--line); border-radius: var(--radius); padding: 32px; text-align: center; cursor: pointer; transition: .14s; background: var(--surface-2); }
.drop:hover, .drop.hot { border-color: var(--green); background: rgba(82,227,185,.05); }
.finding { border: 1px solid var(--line); border-left-width: 3px; border-radius: 8px; padding: 12px 14px; background: var(--surface-2); font-size: 13px; }
.finding.high { border-left-color: var(--red); }
.finding.med { border-left-color: var(--orange); }
.finding.low { border-left-color: var(--blue); }
.finding .ft { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; background: var(--bg2); padding: 6px 9px; border-radius: 5px; margin-top: 6px; border: 1px solid var(--line); }
.finding .mask { color: var(--orange); font-weight: 700; }

/* ---------- vault ---------- */
.vault-item { border: 1px solid var(--line); border-radius: 10px; padding: 13px 15px; background: var(--surface-2); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.vault-item .secret { font-family: var(--mono); font-size: 13px; background: var(--bg2); border: 1px solid var(--line); padding: 5px 10px; border-radius: 6px; max-width: 100%; overflow: auto; white-space: pre; word-break: break-all; }
.lockwall { max-width: 400px; margin: 36px auto; text-align: center; }

/* ---------- tables / details ---------- */
table.tb { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.tb th { text-align: left; color: var(--dim); font: 700 10px var(--mono); letter-spacing: .09em; text-transform: uppercase; padding: 9px 11px; border-bottom: 1px solid var(--line); }
table.tb td { padding: 10px 11px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--muted); }
table.tb tr:hover td { background: var(--surface-2); }
table.tb td .mono { color: var(--text); font-size: 12.5px; }
.table-wrap { overflow-x: auto; }
details { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
details > summary { cursor: pointer; padding: 12px 15px; font-size: 13.5px; font-weight: 700; list-style: none; display: flex; gap: 9px; align-items: center; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+"; color: var(--green); font: 700 15px var(--mono); }
details[open] > summary::before { content: "\2212"; }
details .dc { padding: 0 15px 15px; }

/* ---------- modal / toast ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(3,9,8,.78); backdrop-filter: blur(4px); z-index: 100; display: grid; place-items: center; padding: 22px; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); width: 100%; max-width: 620px; max-height: 88vh; overflow: auto; }
.modal .mh { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--surface); z-index: 2; font-weight: 700; }
.modal .mb { padding: 22px; }
.modal .mf { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 9px; justify-content: flex-end; position: sticky; bottom: 0; background: var(--surface); }
#toasts { position: fixed; bottom: 20px; right: 20px; z-index: 300; display: grid; gap: 9px; justify-items: end; }
.toast { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--green); border-radius: 8px; padding: 11px 16px; font-size: 13.5px; max-width: 360px; animation: slidein .18s ease; }
.toast.ok { border-left-color: var(--green); } .toast.bad { border-left-color: var(--red); } .toast.warn { border-left-color: var(--orange); }
@keyframes slidein { from { opacity: 0; transform: translateX(18px) } to { opacity: 1; transform: none } }
.srch-res { padding: 8px 11px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.srch-res:hover { background: var(--surface-2); border-color: var(--line); }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .split, .section-head { grid-template-columns: 1fr; gap: 20px; }

/* ---------- footer ---------- */

.foot code { color: var(--muted); font-size: 11px; }

/* ---------- print sheet (one page) ---------- */
.ps-head { display: grid; grid-template-columns: 1fr auto; gap: 30px; align-items: end; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }

.ps-head h1 span { color: var(--orange); }
.ps-sub { color: var(--muted); font-size: 13.5px; max-width: 62ch; margin: 12px 0 0; }

.ps-acct { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--surface); min-width: 215px; }
.ps-acct b { display: block; font-size: 13px; margin-bottom: 2px; }
.ps-acct code { font: 11px var(--mono); color: var(--green); word-break: break-all; }
.ps-cols { column-count: 3; column-gap: 24px; }
.ps-sec { break-inside: avoid; -webkit-column-break-inside: avoid; margin: 0 0 16px; }
.ps-sec h3 { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 0 0 7px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
table.ps-tb { width: 100%; border-collapse: collapse; font-size: 11.5px; }
table.ps-tb td { padding: 3px 8px 3px 0; border: 0; vertical-align: top; color: var(--muted); }
table.ps-tb tr + tr td { border-top: 1px solid var(--line); }
table.ps-tb td:first-child { width: 56%; }
table.ps-tb code { font: 10.5px var(--mono); color: var(--text); }
.ps-wide { break-inside: avoid; -webkit-column-break-inside: avoid; margin-top: 4px; }
.ps-wide h3 { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 0 0 7px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
.ps-wide .table-wrap table { font-size: 11px; }
.ps-wide th { font-size: 9px; padding: 4px 8px 4px 0; }
.ps-wide td { padding: 4px 8px 4px 0; }
.ps-wide td:first-child { width: 30%; }
.ps-wide td:nth-child(2) { width: 34%; }
.ps-wide td code { font: 10.5px var(--mono); color: var(--text); }
.ps-foot { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--dim); font: 10px var(--mono); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
@media (max-width: 900px) { .ps-cols { column-count: 2; } .ps-head { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .ps-cols { column-count: 1; } }

/* ---------- beginner help ----------
   Every control that does something carries a data-help key. The CSS adds a
   quiet "?" chip; the engine in section 0b turns it into a plain-English
   sentence on hover and on keyboard focus. */
[data-help]{ position:relative; }
[data-help]::after{
  content:"?"; position:absolute; top:-7px; right:-7px;
  width:14px; height:14px; border-radius:50%;
  font-size:9px; line-height:12px; text-align:center; font-weight:600;
  color:var(--dim); background:var(--surface-2); border:1px solid var(--line);
  pointer-events:none; opacity:.5;
  transition:opacity .12s, color .12s, border-color .12s;
}
[data-help]:hover::after,[data-help]:focus-visible::after{ opacity:1; color:var(--ac); border-color:var(--ac); }
/* a 14px chip on a 13px tick box is noise — the hover itself is the hint */
input[type="checkbox"][data-help]::after{ display:none; }
[data-help]:hover,[data-help]:focus-visible{ box-shadow:0 0 0 1px var(--ac) inset; }
.help-pop{
  position:fixed; z-index:120; max-width:330px; min-width:200px;
  background:var(--surface-2); color:var(--text);
  border:1px solid var(--line); border-left:3px solid var(--ac);
  border-radius:10px; padding:10px 12px; font-size:12.5px; line-height:1.5;
  box-shadow:0 14px 34px rgba(0,0,0,.45);
  /* opacity and visibility are deliberately NOT transitioned: if the browser
     throttles the animation (background tab), a transition on them would leave
     the explanation stuck at opacity 0. Only the 4px slide is animated. */
  opacity:0; visibility:hidden; transform:translateY(4px); pointer-events:none;
  transition:transform .12s ease;
}
.help-pop.on{ opacity:1; visibility:visible; transform:none; }
@media (prefers-reduced-motion: reduce){ .help-pop{ transition:none; } }
.help-pop b{ display:block; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ac); margin-bottom:3px; }
.help-pop .hp-w{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); color:var(--orange); }
.side-legend{ margin:10px 2px 0; padding:8px 9px; border:1px dashed var(--line); border-radius:10px; }
.side-legend b{ color:var(--ac); }

/* ---------- print ---------- */
@media print {
  @page { size: A4 portrait; margin: 9mm; }
  :root { color-scheme: light; --bg: #fff; --surface: #fff; --surface-2: #f5f8f6; --line: #ccd8d2; --text: #10221c; --muted: #526860; --dim: #6b7d76; --green: #087a59; --blue: #2c62b8; --orange: #a76a12; --red: #c03a2b; --bg2: #eef5f1; }
  body { background: #fff; font-size: 12px; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  aside, .topbar, #toasts, .modal-bg, .noprint, .help-pop { display: none !important; }
  [data-help]::after{ display:none !important; }
  [data-help]:hover{ box-shadow:none !important; }
  #shell { grid-template-columns: 1fr; }
  .view { max-width: none; padding: 0; }
  .hero { background: #f4faf7; padding: 24px 0; }
  .lesson, .card, .repo, .stat, .table-wrap, .callout, .note { break-inside: avoid; }

  a { color: #087a59; }
  /* the sheet itself: one page, no page furniture */
  .foot { display: none; }
  .ps-head { margin-bottom: 10px; padding-bottom: 8px; grid-template-columns: 1fr !important; }
  .ps-accounts { grid-template-columns: 1fr 1fr; gap: 8px; }
  .ps-acct { padding: 6px 9px; min-width: 0; }
  .ps-head h1 { font-size: 1.55rem; }
  .ps-head .eyebrow { margin-bottom: 6px; font-size: 9px; }
  .ps-sub { font-size: 10.5px; margin-top: 7px; }
  .ps-acct { padding: 6px 9px; }
  .ps-acct b { font-size: 11px; }
  .ps-acct code { font-size: 9.5px; }
  .ps-cols { column-count: 3; column-gap: 15px; }
  .ps-sec { margin-bottom: 9px; }
  .ps-sec h3 { margin-bottom: 4px; padding-bottom: 3px; font-size: 9px; }
  table.ps-tb { font-size: 9.2px; line-height: 1.35; }

  .ps-wide { margin-top: 0; }

  .ps-wide .table-wrap table { font-size: 8.8px; }

}

<body>

<div id="shell">
  <aside>
    <div class="brand">
      <h1><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span> GitHub Command Center</h1>
      <p>Two accounts · one PC<br />credentials encrypted at rest</p>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="tiny dim" id="lockstat">Vault · <b>—</b></div>
      <div class="row" style="gap:6px">
        <button class="sm ghost" onclick="Vault.lock()" style="flex:1" data-help="lock-side" data-lab="Lock vault">Lock</button>
        <button class="sm ghost" onclick="go('#/backup');render()" style="flex:1" data-help="backup-side" data-lab="Backup">Backup</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h2 id="pagetitle">Dashboard</h2>
        <div class="sub" id="pagesub">Your Git control room</div>
      </div>
      <span class="spacer"></span>
      <span class="pill" id="vaultpill">vault · none</span>
      <div class="search">
        <input id="gsearch" placeholder="Search commands and lessons" oninput="globalSearch(this.value)" autocomplete="off" data-help="search" data-lab="Search" />
      </div>
      <button class="sm ghost" onclick="helpGuide()" data-help="guide" data-lab="How to use this page">?</button>
      <button class="sm ghost" onclick="toggleTheme()" title="Toggle light and dark" data-help="theme" data-lab="Light / dark">&#9686;</button>
      <button class="sm pri" onclick="Vault.prompt()" data-help="vault-top" data-lab="Vault">Vault</button>
    </div>
    <div id="view" class="view"></div>
    <footer class="foot">
      <span>GitHub Command Center · single file, no build step · <code>github_manager/index.html</code></span>
      <span>Everything you type stays in this browser. Nothing is uploaded.</span>
    </footer>
  </main>
</div>

<div id="toasts"></div>

<script>
"use strict";
/* ============================================================================
   0. TINY HELPERS
   ========================================================================== */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

function toast(msg,kind="",ms=2600){
  const t=document.createElement("div");
  t.className="toast "+kind; t.textContent=msg;
  $("#toasts").appendChild(t);
  setTimeout(()=>{t.style.transition=".3s";t.style.opacity="0";t.style.transform="translateX(20px)";setTimeout(()=>t.remove(),320)},ms);
}
async function copy(text,label="Copied"){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast(label+" → clipboard","ok");
}

/* Copy buttons are delegated rather than inline.
   An inline onclick carrying nested quotes (copy(getElementById('x').textContent,'y'))
   is parsed unpredictably by the HTML parser and silently swallows the element that
   follows it. A data-attribute carries the id; the listener reads the text at click
   time, so content hydrated after render still copies correctly. */
let COPIES = {};
let MODAL_ACTIONS = {};
function copyBtn(id,label="Command",text="Copy"){
  return `<button class="mini" data-copy="${esc(id)}" data-label="${esc(label)}" data-help="copy" data-lab="${esc(label)}">${esc(text)}</button>`;
}
document.addEventListener("change",e=>{
  const s=e.target.closest("[data-bulk]");
  if(s){
    const k="bulk"+s.dataset.bulk.charAt(0).toUpperCase()+s.dataset.bulk.slice(1);
    DB.set(k, s.value==="true" ? true : s.value==="false" ? false : s.value);
    render();
    return;
  }
  const p=e.target.closest("[data-bulkproj]");
  if(p) toggleBulk(p.dataset.bulkproj);
});
document.addEventListener("click",e=>{
  const term=e.target.closest("[data-term]");
  if(term){ runInTerminal(term.dataset.term); return; }
  const act=e.target.closest("[data-act]");
  if(act){ const fn=MODAL_ACTIONS[act.dataset.act]; if(fn) fn(); return; }
  const b=e.target.closest("[data-copy]");
  if(!b) return;
  const id=b.dataset.copy;
  const txt = Object.prototype.hasOwnProperty.call(COPIES,id) ? COPIES[id] : (document.getElementById(id)||{}).innerText;
  copy(txt||"", b.dataset.label||"Command");
});

/* ============================================================================
   0b. BEGINNER HELP
   A control that does something explains itself. The control carries
   data-help="key"; the sentence lives in HELP below. Nothing is inlined into
   an HTML attribute, which is the same trap that forced data- delegation for
   the copy buttons in the first place.

   HELP values are either a sentence, or [sentence, warning] when clicking the
   thing can lose work.
   ========================================================================== */

  /* ── Dashboard ─────────────────────────────────────────────────────── */

  "nav-learn":["Nine lessons from zero to safe syncing. Read top to bottom once; it teaches the words the rest of the app assumes you know."],

  "m-close":"Closes this pop-up and changes nothing.",
  "m-showaround":["Closes this pop-up and jumps to the two-account setup page, which is the only thing you must fill in before the other pages can help you."],

let helpEl=null, helpFor=null, helpTimer=null;
const helpTarget = e => (e.target && e.target.closest) ? e.target.closest("[data-help]") : null;
function helpEntry(key){
  const h=HELP[key];
  if(!h) return null;
  return Array.isArray(h) ? {d:h[0]||"", w:h[1]||""} : {d:h, w:""};
}
function helpShow(target){
  if(!target) return;
  const t=helpEntry(target.getAttribute("data-help"));
  if(!t) return;
  if(!helpEl){
    helpEl=document.createElement("div");
    helpEl.className="help-pop noprint";
    helpEl.id="help-pop";
    helpEl.setAttribute("role","tooltip");
    document.body.appendChild(helpEl);
  }
  const label=(target.getAttribute("data-lab")||target.innerText||"")
    .replace(/\s+/g," ").trim().slice(0,58);
  helpEl.textContent="";
  const head=document.createElement("b");
  head.textContent=label||"What this does";
  const body=document.createElement("div");
  body.textContent=t.d;
  helpEl.append(head,body);
  if(t.w){
    const warn=document.createElement("div");
    warn.className="hp-w";
    warn.textContent="Careful — "+t.w;
    helpEl.appendChild(warn);
  }
  helpEl.classList.add("on");
  if(helpFor&&helpFor!==target) helpFor.removeAttribute("aria-describedby");
  helpFor=target;
  target.setAttribute("aria-describedby","help-pop");
  const r=target.getBoundingClientRect();
  helpEl.style.left="0px"; helpEl.style.top="0px";
  const w=helpEl.offsetWidth||300, h=helpEl.offsetHeight||70;
  const left=clamp(r.left+r.width/2-w/2, 10, Math.max(10,innerWidth-w-10));
  let top=r.top-h-10;
  if(top<8) top=r.bottom+10;
  helpEl.style.left=Math.round(left)+"px";
  helpEl.style.top=Math.round(top)+"px";
}
function helpHide(){
  clearTimeout(helpTimer);
  if(helpEl) helpEl.classList.remove("on");
  if(helpFor){ helpFor.removeAttribute("aria-describedby"); helpFor=null; }
}
document.addEventListener("mouseover",e=>{
  const t=helpTarget(e);
  if(!t){ helpHide(); return; }
  if(t===helpFor) return;
  clearTimeout(helpTimer);
  helpTimer=setTimeout(()=>helpShow(t),150);
});
document.addEventListener("mouseout",e=>{
  const t=helpTarget(e);
  if(!t) return;
  if(e.relatedTarget && t.contains(e.relatedTarget)) return;
  helpHide();
});
document.addEventListener("focusin",e=>{ const t=helpTarget(e); t?helpShow(t):helpHide(); });
document.addEventListener("focusout",e=>{ if(!e.relatedTarget||!e.relatedTarget.closest?.("[data-help]")) helpHide(); });
addEventListener("scroll",helpHide,true);
addEventListener("resize",helpHide);
if(window.matchMedia && matchMedia("(hover:none)").matches){
  document.addEventListener("click",e=>{ const t=helpTarget(e); t?helpShow(t):helpHide(); });
}

/* ============================================================================
   2. ENCRYPTED VAULT  (PBKDF2-SHA256 600k → AES-GCM-256)
      NOTHING sensitive is ever written unencrypted to disk.
   ========================================================================== */
const Vault = (()=>{
  const META="vaultMeta", DATA="vaultData", LOCKMS=5*60*1000;
  let key=null, timer=null, lastAct=0;

  const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
  const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
  const rand = n => crypto.getRandomValues(new Uint8Array(n));

  async function derive(pw,salt){
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      {name:"PBKDF2", salt, iterations:600000, hash:"SHA-256"}, km,
      {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  }
  async function enc(k,obj){
    const iv=rand(12);
    const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv}, k, new TextEncoder().encode(JSON.stringify(obj)));
    return b64(iv)+"."+b64(ct);
  }
  async function dec(k,payload){
    const [a,b]=payload.split(".");
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(a)}, k, unb64(b));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  async function create(pw){
    const salt=rand(16), k=await derive(pw,salt);
    const meta={salt:b64(salt), verifier: await enc(k,{ok:true}), iters:600000, created:Date.now()};
    localStorage.setItem("ghc:"+META, JSON.stringify(meta));
    key=k; touch();
    localStorage.setItem("ghc:"+DATA, await enc(k, []));
    return true;
  }
  async function unlock(pw){
    const meta=JSON.parse(localStorage.getItem("ghc:"+META)||"null");
    if(!meta) return false;
    const k=await derive(pw, unb64(meta.salt));
    try{ await dec(k, meta.verifier); }catch(e){ return false; }
    key=k; touch(); return true;
  }
  function touch(){ lastAct=Date.now(); schedule(); }
  function schedule(){ clearTimeout(timer); timer=setTimeout(()=>{ if(key) lock("auto-locked after 5 min idle"); }, LOCKMS); }
  function lock(msg="Vault locked"){
    key=null; localStorage.removeItem("ghc:"+DATA+"_cache");
    const s=$("#lockstat"); if(s) s.innerHTML='Vault: <b class="pill warn">locked</b>';
    const el=$("#vaultlist"); if(el) el.innerHTML = lockHTML(msg);
    if(msg) toast(msg,"warn");
  }
  async function items(){
    if(!key) return null;
    const raw=localStorage.getItem("ghc:"+DATA);
    if(!raw) return [];
    try{ return await dec(key,raw); }catch(e){ lock("Could not decrypt — wrong password?"); return null; }
  }
  async function save(arr){
    if(!key) return false;
    localStorage.setItem("ghc:"+DATA, await enc(key,arr));
    return true;
  }
  const exists = () => !!localStorage.getItem("ghc:"+META);
  const status = ()=> exists() ? (key?"unlocked":"locked") : "none";

  async function prompt(){
    if(!window.crypto?.subtle){
      return modal("Encryption unavailable",
        `<div class="note bad">Your browser blocks the Web Crypto API here. Open this file in Chrome/Edge, or serve it from <code class="mono">localhost</code>, so AES‑GCM encryption works.</div>`);
    }
    if(!exists()){
      return modal("Create your vault",
        `<p class="muted tiny">Your vault is <b>encrypted in this browser</b> with AES‑256‑GCM, using a key stretched from your master password (600,000 PBKDF2 rounds). The master password is <b>never stored</b> — if you lose it, the vault cannot be recovered by anyone, including me.</p>
         <div class="field" style="margin-top:14px"><label class="fl">Master password</label><input type="password" id="vnew1" data-help="vault-pw1" data-lab="Master password" placeholder="Something only you know"/></div>
         <div class="field" style="margin-top:10px"><label class="fl">Repeat</label><input type="password" id="vnew2" data-help="vault-pw2" data-lab="Repeat password" placeholder="Again"/></div>
         <div class="note warn" style="margin-top:12px">⚠️ Browser storage is cleared if you wipe site data or switch browsers. Use <b>Backup</b> in the sidebar to export an encrypted file.</div>`,
        [{t:"Create vault",cls:"pri",fn:async()=>{
            const a=$("#vnew1").value, b=$("#vnew2").value;
            if(a.length<8) return toast("Use at least 8 characters","bad");
            if(a!==b) return toast("Passwords don't match","bad");
            await create(a); closeModal(); go("#/secrets"); render(); toast("Vault created & unlocked","ok");
          }}]);
    }
    if(key) return modal("Vault unlocked",`<p class="muted">Your vault is open. It re-locks automatically after 5 minutes of inactivity.</p>
      <p class="tiny dim" style="margin-top:10px">Tip: your OS clipboard history (Win+V / Cmd+Shift+V) can store copies. Prefer pasting straight into GitHub's field.</p>`,
      [{t:"Close",fn:closeModal}]);
    return modal("Unlock vault",
      `<div class="field"><label class="fl">Master password</label><input type="password" id="vpw" placeholder="Master password" data-help="vault-pw1" data-lab="Master password" onkeydown="if(event.key==='Enter')document.getElementById('vunlock').click()"/></div>`,
      [{t:"Close",fn:closeModal},{t:"Unlock",cls:"pri",id:"vunlock",fn:async()=>{
          const pw=$("#vpw").value;
          const ok=await unlock(pw);
          if(!ok) return toast("Wrong password","bad");
          closeModal(); render(); toast("Vault unlocked","ok");
        }}]);
  }
  function lockHTML(msg){
    return `<div class="lockwall">
      <div style="font-size:44px">🔐</div>
      <h3 style="margin:10px 0 4px">Vault locked</h3>
      <p class="muted tiny">${esc(msg||"Your keys, tokens and passphrases are encrypted at rest.")}</p>
      <button class="pri" style="margin-top:14px" data-help="sec-unlock" data-lab="Unlock vault" onclick="Vault.prompt()">Unlock vault</button>
    </div>`;
  }
  function paint(){
    const st=status(), cls = st==="unlocked"?"ok":st==="none"?"":"warn";
    const s=$("#lockstat");
    if(s) s.innerHTML='vault · <b class="pill '+cls+'">'+st+'</b>';
    const p=$("#vaultpill");
    if(p){ p.className="pill "+cls; p.textContent="vault · "+st; }
  }
  ["click","keydown"].forEach(ev=>document.addEventListener(ev,touch,{passive:true}));
  return {prompt,lock,paint,status,exists,items,save,_lockHTML:lockHTML};
})();

/* ============================================================================
   3. SECRET SCANNER RULES
   ========================================================================== */
const SCAN_RULES=[
  {id:"ssh",     sev:"high", name:"SSH / PGP private key",      re:/-----BEGIN ((RSA|DSA|EC|OPENSSH|PGP|ENCRYPTED) )?PRIVATE KEY-----/g, advice:"Never commit. Add to .gitignore and remove from history."},
  {id:"aws",     sev:"high", name:"AWS access key id",         re:/\b((?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16})\b/g, advice:"Rotate in IAM immediately."},
  {id:"ghtok",   sev:"high", name:"GitHub token",               re:/\b(gh[pousr]_[A-Za-z0-9]{36,251}|github_pat_[A-Za-z0-9_]{22,})\b/g, advice:"Revoke at github.com/settings/tokens and rotate."},
  {id:"ghoauth", sev:"high", name:"Google OAuth client secret", re:/\b(GOCSPX-[A-Za-z0-9]{28,})\b/g, advice:"Delete in Google Cloud console."},
  {id:"gapi",    sev:"high", name:"Google API key",             re:/\b(AIza[0-9A-Za-z\-_]{35})\b/g, advice:"Restrict + rotate in Cloud console."},
  {id:"slack",   sev:"high", name:"Slack token",                re:/\b(xox[baprs]-[A-Za-z0-9-]{10,})\b/g, advice:"Revoke in Slack app admin."},
  {id:"stripe",  sev:"high", name:"Stripe secret key",          re:/\b((?:sk|rk)_(?:live|test)_[A-Za-z0-9]{10,99})\b/g, advice:"Roll the key in Stripe dashboard."},
  {id:"anthrop", sev:"high", name:"Anthropic API key",          re:/\b(sk-ant-[A-Za-z0-9\-_]{20,})\b/g, advice:"Rotate in Anthropic console."},
  {id:"openai",  sev:"high", name:"OpenAI API key",             re:/\b(sk-(?:proj-)?[A-Za-z0-9_-]{32,})\b/g, advice:"Rotate at platform.openai.com."},
  {id:"npm",     sev:"high", name:"npm token",                  re:/\b(npm_[A-Za-z0-9]{36})\b/g, advice:"npm token revoke --all."},
  {id:"twilio",  sev:"high", name:"Twilio key",                 re:/\b(SK[0-9a-fA-F]{32})\b/g, advice:"Rotate in Twilio console."},
  {id:"sendg",   sev:"high", name:"SendGrid key",               re:/\b(SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,})\b/g, advice:"Revoke in SendGrid."},
  {id:"mailgun", sev:"high", name:"Mailgun key",                re:/\b(key-[0-9a-f]{32})\b/g, advice:"Rotate in Mailgun."},
  {id:"pypi",    sev:"high", name:"PyPI upload token",          re:/\b(pypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,})\b/g, advice:"Rotate the token."},
  {id:"connstr", sev:"high", name:"DB / broker URL w/ password",re:/\b((?:mongodb(?:\+srv)?|postgres(?:ql)?|mysql|redis|amqp|ftp|ssh):\/\/[^\s:/@]+:[^\s:/@]+@[^\s"']+)/gi, advice:"Move to environment variables."},
  {id:"jwt",     sev:"med",  name:"JSON Web Token",             re:/\b(eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,})\b/g, advice:"Short-lived tokens shouldn't be committed."},
  {id:"assign",  sev:"med",  name:"Hard-coded credential",      re:/\b((?:password|passwd|pwd|secret|token|api[_-]?key|access[_-]?key|auth|private[_-]?key)["']?\s*[:=]\s*["'][^"'\s$]{8,}["'])/gi, advice:"Use process.env / a .env file that is gitignored."},
  {id:"netrc",   sev:"med",  name:".netrc / credential file",   re:/(^\s*machine\s+\S+\s+login\s+\S+\s+password\s+\S+)/gm, advice:"Never commit .netrc."}
];
const RISKY_FILES=[/^\.env(\..+)?$/i,/^id_(rsa|dsa|ecdsa|ed25519)(\.pub)?$/i,/^.*\.(pem|key|p12|pfx|jks|keystore|asc|ppk)$/i,/^\.npmrc$/i,/^\.netrc$/i,/^credentials$/i,/^\.htpasswd$/i,/^service-account.*\.json$/i,/^.*-service-account.*\.json$/i,/^secrets?\.(ya?ml|json|toml|ini)$/i,/^config\.secret.*/i,/^id_rsa.*/i,/^firebase-adminsdk.*\.json$/i];

function maskSecret(s){
  if(s.length<=8) return s.slice(0,2)+"••••";
  return s.slice(0,4)+"•".repeat(Math.min(18,s.length-8))+s.slice(-4);
}
function scanText(text,name="pasted-text"){
  const findings=[];
  if(RISKY_FILES.some(r=>r.test(name.split("/").pop())))
    findings.push({name:"Sensitive filename", sev:"high", rule:"sensitive-file", line:0, snippet:name, advice:"This file should never be committed. Add to .gitignore."});
  SCAN_RULES.forEach(rule=>{
    rule.re.lastIndex=0;
    let m;
    while((m=rule.re.exec(text))!==null){
      const line=text.slice(0,m.index).split("\n").length;
      findings.push({name:rule.name, sev:rule.sev, rule:rule.id, line, match:m[1]||m[0], advice:rule.advice});
      if(findings.length>400) break;
    }
  });
  return findings;
}

    return `<div class="note warn">Nothing recognised in that output. The script prints <code class="mono">##HISTORY v1</code> first — copy from there to <code class="mono">##HISTORYEND</code>.</div>`;

  const rot=rotationList(parsed);
  const live=rot.filter(r=>r.inHead);
  let html=`
    <div class="table-wrap" style="margin-bottom:14px"><table class="tb">
      <thead><tr><th>Repo</th><th>Result</th></tr></thead>
      <tbody>${parsed.scans.map(s=>`<tr><td><b>${esc(s.repo)}</b></td><td><span class="st ${s.status==="HIT"?"preview":"live"}">${esc(s.status)}</span> ${esc(s.detail)}</td></tr>`).join("")}</tbody>

function redactText(text){
  let out=text;

    // STRING, so mm[1] is a character index, not a capture group.
    out=out.replace(r.re, mm=> maskSecret(mm));
  });
  return out;

/* ============================================================================
   4b. PRE-COMMIT GUARD GENERATORS
   A browser cannot intercept `git commit`, so this app does not pretend to.
   It emits a real hook for YOUR machine, generated from the same SCAN_RULES
   the in-app scanner uses, so the two can never quietly drift apart.
   ========================================================================== */
/* Portable POSIX-ERE subset. Deliberately hand-written: JavaScript \b and (?:…)
   have no POSIX equivalent, so the JS sources cannot be translated safely. */
const SHELL_RULES=[
  ["AWS access key",             "(AKIA|ASIA|AGPA|AIDA|AROA)[A-Z0-9]{16}"],
  ["GitHub token",               "gh[psou]_[A-Za-z0-9]{36,}"],
  ["GitHub fine-grained PAT",    "github_pat_[A-Za-z0-9_]{22,}"],
  ["Slack token",                "xox[baprs]-[A-Za-z0-9-]{10,}"],
  ["Stripe secret key",          "(sk|rk)_live_[A-Za-z0-9]{10,}"],
  ["Google API key",             "AIza[0-9A-Za-z_-]{35}"],
  ["Anthropic API key",          "sk-ant-[A-Za-z0-9_-]{20,}"],
  ["OpenAI API key",             "sk-(proj-)?[A-Za-z0-9_-]{32,}"],
  ["npm token",                  "npm_[A-Za-z0-9]{36}"],
  ["SendGrid key",               "SG\\.[A-Za-z0-9_-]{16,}\\.[A-Za-z0-9_-]{16,}"],
  ["Mailgun key",                "key-[0-9a-f]{32}"],
  ["SSH or PGP private key",     "-----BEGIN (RSA|DSA|EC|OPENSSH|PGP|ENCRYPTED)? ?PRIVATE KEY-----"],
  ["Database URL with password", "[a-zA-Z][a-zA-Z0-9+.-]*://[^/[:space:]]+:[^@/[:space:]]+@"]
];

function shellHook(){
  return `#!/bin/sh
# ───────────────────────────────────────────────────────────────
#  Pre-commit secret guard
#  Generated by GitHub Command Center - github_manager/index.html
#
#  Cancels \`git commit\` when a staged file contains a credential.
#  Remove : rm .git/hooks/pre-commit
#  Bypass : git commit --no-verify   (only if you are sure it is a false positive)
# ───────────────────────────────────────────────────────────────
ESC=$(printf '\\\\033')
RED="$ESC[31m"; YEL="$ESC[33m"; RST="$ESC[0m"
[ -t 1 ] || { RED=""; YEL=""; RST=""; }

TMPD=$(mktemp -d 2>/dev/null) || exit 0
trap 'rm -rf "$TMPD"' EXIT INT TERM
RULES="$TMPD/rules"; PAT="$TMPD/patterns"; BLOB="$TMPD/blob"

# One rule per line: LABEL~POSIX-ERE. Neither labels nor patterns contain '~'.
cat > "$RULES" <<'ENDOF_RULES'
${SHELL_RULES.map(r=>r[0]+"~"+r[1]).join("\n")}
ENDOF_RULES

cut -d'~' -f2- "$RULES" > "$PAT"
git diff --cached --name-only --diff-filter=ACMR > "$TMPD/files" 2>/dev/null

FOUND=0
while IFS= read -r f; do
  [ -n "$f" ] || continue
  git show ":$f" > "$BLOB" 2>/dev/null || continue
  [ -s "$BLOB" ] || continue
  LC_ALL=C grep -Eqf "$PAT" "$BLOB" 2>/dev/null || continue

  printf '%sBLOCKED%s  %s\\n' "$RED" "$RST" "$f"
  while IFS='~' read -r label pat; do
    [ -n "$pat" ] || continue
    if LC_ALL=C grep -Eq -- "$pat" "$BLOB" 2>/dev/null; then
      ln=$(LC_ALL=C grep -aonE -m1 -- "$pat" "$BLOB" 2>/dev/null | head -1 | cut -d: -f1)
      printf '        %s%-26s%s line %s\\n' "$YEL" "$label" "$RST" "$ln"
    fi
  done < "$RULES"
  FOUND=1
done < "$TMPD/files"

if [ "$FOUND" -ne 0 ]; then
  printf '\\n%sCommit cancelled - a credential is staged.%s\\n\\n' "$YEL" "$RST"
  printf '  1. If it is real, ROTATE it now. Deleting the file later does not help.\\n'
  printf '  2. Unstage it:   git restore --staged <file>\\n'
  printf '  3. Add it to .gitignore, or commit a .env.example instead.\\n'
  printf '  4. False positive?   git commit --no-verify\\n\\n'
  exit 1
fi
exit 0`;
}

function nodeHook(){
  const rules=SCAN_RULES.map(r=>({name:r.name, sev:r.sev, source:r.re.source, flags:r.re.flags, advice:r.advice}));
  return `#!/usr/bin/env node
"use strict";
// ───────────────────────────────────────────────────────────────
//  Pre-commit secret guard (Node)
//  Generated by GitHub Command Center - github_manager/index.html
//
//  Uses the exact same rule set as the in-app Secret Scanner, so a
//  clean scan in the browser means a clean commit in your terminal.
// ───────────────────────────────────────────────────────────────
const { execFileSync } = require("child_process");

const RULES = ${JSON.stringify(rules, null, 2)};

const R = "\\x1b[31m", Y = "\\x1b[33m", D = "\\x1b[2m", X = "\\x1b[0m";
const SKIP = /\\.(png|jpe?g|gif|ico|webp|svg|pdf|zip|gz|tgz|bz2|xz|7z|rar|mp4|mp3|mov|avi|woff2?|ttf|eot|so|dll|dylib|exe|class|jar|wasm|bin|lock)$/i;

function staged() {
  try {
    return execFileSync("git", ["diff", "--cached", "--name-only", "--diff-filter=ACMR"],
                        { encoding: "utf8", maxBuffer: 64 * 1024 * 1024 })
      .split("\\n").filter(Boolean);
  } catch (e) { return []; }
}

let blocked = false;

for (const file of staged()) {
  if (SKIP.test(file)) continue;
  let content;
  try {
    content = execFileSync("git", ["show", ":" + file],
                           { encoding: "utf8", maxBuffer: 64 * 1024 * 1024 });
  } catch (e) { continue; }
  if (!content || content.indexOf("\\u0000") !== -1) continue;   // binary blob

  const hits = [];
  for (const r of RULES) {
    const flags = r.flags.indexOf("g") === -1 ? r.flags + "g" : r.flags;
    const m = new RegExp(r.source, flags).exec(content);
    if (!m) continue;
    hits.push({
      label:  r.name,
      line:   content.slice(0, m.index).split("\\n").length,
      advice: r.advice
    });
  }
  if (!hits.length) continue;

  blocked = true;
  console.error("\\n" + R + "BLOCKED" + X + "  " + file);
  for (const h of hits.slice(0, 6)) {
    console.error("        " + Y + h.label + X + "  line " + h.line);
    console.error("          " + D + h.advice + X);
  }
  if (hits.length > 6) console.error("        " + D + "...and " + (hits.length - 6) + " more" + X);
}

if (blocked) {
  console.error("\\n" + Y + "Commit cancelled - a credential is staged." + X + "\\n");
  console.error("  1. If it is real, ROTATE it now. Deleting the file later does not help.");
  console.error("  2. Unstage it:   git restore --staged <file>");
  console.error("  3. Add it to .gitignore, or commit a .env.example instead.");
  console.error("  4. False positive?   git commit --no-verify\\n");
  process.exit(1);
}
process.exit(0);
`;
}

/* ============================================================================
   4d. BULK GUARD INSTALLER
   Writes to many folders at once, so it is conservative by construction:
   dry-run by default, existing hooks are backed up never overwritten, and
   every installed hook is syntax-checked before it is counted as a success.
   ========================================================================== */
function bulkScript(){
  const all=Repos.map(r=>r.id);
  const sel=DB.get("bulkSel",null)||all;
  const repos=Repos.filter(r=>sel.indexOf(r.id)!==-1 && r.path);
  const mode=DB.get("bulkMode","personal");
  const engine=DB.get("bulkEngine","sh");
  const dry=DB.get("bulkDry",true);
  const which=DB.get("bulkHook","commit");
  const commitHook=engine==="node"?nodeHook():shellHook();
  const pushHookSrc=engine==="node"?pushHookNode():pushHook();
  const paths=repos.map(r=>r.path).join("\n");
  return `#!/bin/sh
# ───────────────────────────────────────────────────────────────
#  Bulk guard installer
#  Generated by GitHub Command Center - github_manager/index.html
#  MODE   personal = .git/hooks        shared = .githooks (committed)
#  ENGINE sh        = no dependencies  node = full rule set
#  HOOKS  which     = commit | push | both
#  DRY    1 = report only, writes nothing
#
#  It never overwrites a hook you wrote. Any pre-existing hook is copied to
#  <name>.bak before this one is installed.
# ───────────────────────────────────────────────────────────────

MODE="${mode}"
ENGINE="${engine}"
HOOKS="${which}"
DRY=${dry?1:0}

TMPD=$(mktemp -d) || exit 1
trap 'rm -rf "$TMPD"' EXIT INT TERM

cat > "$TMPD/hook-commit" <<'GUARD_HOOK'
${commitHook}
GUARD_HOOK

cat > "$TMPD/hook-push" <<'GUARD_HOOK'
${pushHookSrc}
GUARD_HOOK

cat > "$TMPD/projects" <<'ENDPROJECTS'
${paths}
ENDPROJECTS

N=0; OKC=0; SKIPC=0; WARN=0; FAILE=0
printf 'Bulk guard install - mode %s, engine %s, dry-run %s\\n\\n' "$MODE" "$ENGINE" "$DRY"

while IFS= read -r raw; do
  [ -n "$raw" ] || continue
  p="$raw"
  case "$p" in
    "~")   p="$HOME" ;;
    "~/"*) r=$(printf '%s' "$p" | cut -c3-); p="$HOME/$r" ;;
  esac
  name=$(basename "$p")

  if [ ! -d "$p" ]; then
    SKIPC=$((SKIPC+1)); printf 'SKIP   %-28s folder not found\\n' "$name"; continue
  fi
  if [ ! -e "$p/.git" ]; then
    SKIPC=$((SKIPC+1)); printf 'SKIP   %-28s not a git repository\\n' "$name"; continue
  fi

  hp=$(git -C "$p" config --get core.hooksPath 2>/dev/null)
  if [ -n "$hp" ]; then
    case "$hp" in
      /*) target="$hp" ;;
      *)  target="$p/$hp" ;;
    esac
  elif [ "$MODE" = "shared" ]; then
    target="$p/.githooks"
  else
    target="$p/.git/hooks"
  fi
  if [ "$DRY" != "1" ]; then
    mkdir -p "$target" 2>/dev/null || {
      FAILE=$((FAILE+1)); printf 'FAIL   %-28s cannot create %s\\n' "$name" "$target"; continue
    }
  fi

  # which hook files does this project need? git only ever runs the exact
  # names pre-commit and pre-push, so the filenames matter as much as the guard.
  case "$HOOKS" in
    commit) LIST="pre-commit" ;;
    push)   LIST="pre-push" ;;
    *)      LIST="pre-commit pre-push" ;;
  esac

  for h in $LIST; do
    src="$TMPD/hook-$(printf '%s' "$h" | cut -c5-)"
    dest="$target/$h"
    case "$h" in
      pre-commit) mark='Pre-commit secret guard' ;;
      *)          mark='Pre-push secret guard' ;;
    esac

    if [ -f "$dest" ]; then
      if grep -q "$mark" "$dest" 2>/dev/null; then
        OKC=$((OKC+1)); printf 'OK     %-28s %s guard already installed\\n' "$name" "$h"; continue
      fi
      if [ "$DRY" = "1" ]; then
        WARN=$((WARN+1)); printf 'DRY    %-28s would back up your existing %s, then install\\n' "$name" "$h"; continue
      fi
      cp "$dest" "$dest.bak"
      WARN=$((WARN+1)); printf 'BACKUP %-28s your %s saved as %s.bak\\n' "$name" "$h" "$h"
    elif [ "$DRY" = "1" ]; then
      N=$((N+1)); printf 'DRY    %-28s would install %s into %s\\n' "$name" "$h" "$target"; continue
    fi

    cp "$src" "$dest" 2>/dev/null || {
      FAILE=$((FAILE+1)); printf 'FAIL   %-28s could not write %s\\n' "$name" "$dest"; continue
    }
    chmod +x "$dest" 2>/dev/null

    if [ "$ENGINE" = "node" ]; then
      if command -v node >/dev/null 2>&1 && node --check "$dest" >/dev/null 2>&1; then
        N=$((N+1)); printf 'OK     %-28s %s guard installed and parsed by node\\n' "$name" "$h"
      else
        FAILE=$((FAILE+1)); printf 'FAIL   %-28s %s written but node could not parse it\\n' "$name" "$h"
      fi
    else
      if sh -n "$dest" >/dev/null 2>&1; then
        N=$((N+1)); printf 'OK     %-28s %s guard installed and passed sh -n\\n' "$name" "$h"
      else
        FAILE=$((FAILE+1)); printf 'FAIL   %-28s %s written but the shell syntax check failed\\n' "$name" "$h"
      fi
    fi
  done

  if [ "$DRY" = "1" ]; then
    if [ "$MODE" = "shared" ] && [ -z "$hp" ]; then
      printf '       %-28s would set core.hooksPath to .githooks - commit that folder to share it\\n' "$name"
    fi
    continue
  fi

  if [ "$MODE" = "shared" ] && [ -z "$hp" ]; then
    git -C "$p" config core.hooksPath .githooks 2>/dev/null \\
      && printf '       %-28s core.hooksPath set to .githooks - commit that folder to share it\\n' "$name"
  fi
done < "$TMPD/projects"

printf '\\ninstalled %s · already present %s · skipped %s · warnings %s · failed %s\\n' "$N" "$OKC" "$SKIPC" "$WARN" "$FAILE"
if [ "$DRY" = "1" ]; then
  printf 'This was a dry run. Change DRY=0 in the script when you are ready.\\n'
elif [ "$FAILE" -eq 0 ]; then
  printf 'Done. Every selected project is now guarded.\\n'
fi
`;
}
function bulkTargets(){
  const all=Repos.map(r=>r.id);
  const sel=DB.get("bulkSel",null)||all;
  return Repos.filter(r=>sel.indexOf(r.id)!==-1 && r.path);
}
function toggleBulk(id){
  const all=Repos.map(r=>r.id);
  const sel=(DB.get("bulkSel",null)||all).slice();
  const i=sel.indexOf(id);

}

/* ============================================================================
   4f. PRE-PUSH GUARD
   Harder than pre-commit: git hands the hook a ref/sha list and nothing else,
   so the pushed range has to be reconstructed. Scans ADDED lines per commit,
   not the final tree - a secret added and removed inside the same push was
   still uploaded and is still in the remote's history.
   ========================================================================== */
function pushHook(){
  return `#!/bin/sh
# ───────────────────────────────────────────────────────────────
#  Pre-push secret guard
#  Generated by GitHub Command Center - github_manager/index.html
#
#  Cancels \`git push\` when a commit being uploaded ADDS a credential.
#  Second line of defence: it catches what got past pre-commit -
#  a --no-verify commit, or a commit made before the hook was installed.
#
#  Remove : rm .git/hooks/pre-push
#  Bypass : git push --no-verify
# ───────────────────────────────────────────────────────────────
ZERO=0000000000000000000000000000000000000000
ESC=$(printf '\\033'); RED="$ESC[31m"; YEL="$ESC[33m"; RST="$ESC[0m"
[ -t 1 ] || { RED=""; YEL=""; RST=""; }

TMPD=$(mktemp -d 2>/dev/null) || exit 0
trap 'rm -rf "$TMPD"' EXIT INT TERM
RULES="$TMPD/rules"; PAT="$TMPD/patterns"; ADDED="$TMPD/added"; RES="$TMPD/res"

# One rule per line: LABEL~POSIX-ERE
cat > "$RULES" <<'ENDPUSHRULES'
${SHELL_RULES.map(r=>r[0]+"~"+r[1]).join("\n")}
ENDPUSHRULES
cut -d'~' -f2- "$RULES" > "$PAT"

R1="$1"; R2="$2"
printf '##PUSH|v1|%s|%s\\n' "$R1" "$R2"
: > "$RES"
BLOCKED=0
SCANNED=0

while read -r LR LS RR RS || [ -n "$LS" ]
do
  [ -n "$LS" ] || continue
  [ "$LS" = "$ZERO" ] && continue
  # a deleted ref arrives as "<ref> (delete) 0000.. <remote ref> <sha>"
  if [ "$LS" = "(delete)" ]; then
    printf '##PUSHREF|%s|%s|delete|nothing to upload\\n' "$R1" "$LR" >> "$RES"
    continue
  fi

  if [ "$RS" = "$ZERO" ]; then
    KIND=new
    COMMITS=$(git rev-list "$LS" --not --remotes 2>/dev/null)
  else
    KIND=update
    COMMITS=$(git rev-list "$RS..$LS" 2>/dev/null)
  fi

  n=$(printf '%s\\n' "$COMMITS" | grep -c .)
  [ "$n" -gt 0 ] || { printf '##PUSHREF|%s|%s|%s|nothing new\\n' "$R1" "$LR" "$KIND" >> "$RES"; continue; }
  printf '##PUSHREF|%s|%s|%s|%s commit(s)\\n' "$R1" "$LR" "$KIND" "$n" >> "$RES"

  for c in $COMMITS; do
    SCANNED=$((SCANNED+1))
    short=$(printf '%s' "$c" | cut -c1-8)
    # added lines only, tagged with the file they came from
    git -c core.quotePath=false show --pretty=format: --unified=0 "$c" 2>/dev/null | awk '
      /^\\+\\+\\+ / {
        f = substr($0,5)
        if (f ~ /^"/) { gsub(/"/, "", f); sub(/^b\\//, "", f) }
        else          { sub(/^b\\//, "", f) }
        sub(/\\t+$/, "", f)
        next
      }
      /^@@/           { next }
      /^\\+/           { if (f != "") print f "\\t" substr($0,2) }
    ' > "$ADDED"
    [ -s "$ADDED" ] || continue
    LC_ALL=C grep -Eqf "$PAT" "$ADDED" 2>/dev/null || continue

    while IFS='~' read -r label pat; do
      [ -n "$pat" ] || continue
      hit=$(LC_ALL=C grep -aonE -m1 -- "$pat" "$ADDED" 2>/dev/null | head -1)
      [ -n "$hit" ] || continue
      ln=$(printf '%s' "$hit" | cut -d: -f1)
      mv=$(printf '%s' "$hit" | cut -d: -f2-)
      f=$(sed -n "\${ln}p" "$ADDED" 2>/dev/null | cut -f1)
      pre=$(printf '%s' "$mv" | cut -c1-8)
      suf=$(printf '%s' "$mv" | awk '{n=length($0); print (n>4)?substr($0,n-3):$0}')
      printf '##PUSHBLOCK|%s|%s|%s|%s|%s|%s\\n' "$short" "$LR" "$f" "$label" "$pre****$suf" "$R1" >> "$RES"
      BLOCKED=1
    done < "$RULES"
  done
done

cat "$RES" 2>/dev/null
printf '##PUSHSCANNED|%s\\n' "$SCANNED"

if [ "$BLOCKED" -ne 0 ]; then
  printf '\\n%sPush cancelled - a commit being uploaded adds a credential.%s\\n\\n' "$YEL" "$RST"
  printf ' 1. ROTATE it now if it is real. Nothing reached the remote - that is the good news.\\n'
  printf ' 2. Drop or revert the offending commit:\\n'
  printf '      git log --oneline -5\\n'
  printf '      git rebase -i HEAD~5\\n'
  printf ' 3. False positive? git push --no-verify\\n\\n'
  exit 1
fi
printf 'Push allowed - %s commit(s) scanned, nothing found.\\n' "$SCANNED"
exit 0
`;
}
function pushHookNode(){
  const rules=SHELL_RULES.map(([name,src])=>({name,source:src}));
  return `#!/usr/bin/env node
"use strict";
// ───────────────────────────────────────────────────────────────
//  Pre-push secret guard (Node)
//  Generated by GitHub Command Center - github_manager/index.html
//
//  Cancels \`git push\` when a commit being uploaded ADDS a credential.
// ───────────────────────────────────────────────────────────────
const { execFileSync } = require("child_process");

const RULES = ${JSON.stringify(rules, null, 2)}.map((r) => ({ ...r, re: new RegExp(r.source, "g") }));
const ZERO = "0".repeat(40);

const git = (args) => {
  try { return execFileSync("git", args, { encoding: "utf8", maxBuffer: 256 * 1024 * 1024 }); }
  catch (e) { return (e.stdout || "").toString(); }
};

const remote = process.argv[2] || "?";
const url = process.argv[3] || "?";
console.log("##PUSH|v1|" + remote + "|" + url);

let blocked = false;
let scanned = 0;

const stdin = require("fs").readFileSync(0, "utf8").split("\\n").filter(Boolean);

for (const line of stdin) {
  const parts = line.trim().split(/\\s+/);
  if (parts.length < 4) continue;
  const [localRef, localSha, , remoteSha] = parts;
  if (!localSha || localSha === ZERO) continue;
  // a deleted ref arrives as "<ref> (delete) 0000.. <remote ref> <sha>"
  if (localSha === "(delete)") {
    console.log("##PUSHREF|" + remote + "|" + localRef + "|delete|nothing to upload");
    continue;
  }

  const range = remoteSha === ZERO ? localSha + " --not --remotes" : remoteSha + ".." + localSha;
  const kind = remoteSha === ZERO ? "new" : "update";
  const commits = git(["rev-list", ...range.split(" ")]).split("\\n").filter(Boolean);
  if (!commits.length) {
    console.log("##PUSHREF|" + remote + "|" + localRef + "|" + kind + "|nothing new");
    continue;
  }
  console.log("##PUSHREF|" + remote + "|" + localRef + "|" + kind + "|" + commits.length + " commit(s)");

  for (const c of commits) {
    scanned++;
    const patch = git(["-c", "core.quotePath=false", "show", "--pretty=format:", "--unified=0", c]);
    let file = "";
    const added = [];
    for (const l of patch.split("\\n")) {
      if (l.startsWith("+++ ")) {
        // git appends a trailing TAB when the path contains a space,
        // and quotes the whole path when it holds other special characters.
        let f = l.slice(4);
        if (f.startsWith('"') && f.endsWith('"')) {
          try { f = JSON.parse(f); } catch (_) { f = f.slice(1, -1); }
        }
        file = (f.startsWith("b/") ? f.slice(2) : f).replace(/\\t+$/, "").trim();
        continue;
      }
      if (l.startsWith("---") || l.startsWith("@@")) continue;
      if (l.startsWith("+") && file) added.push({ file, text: l.slice(1) });
    }
    if (!added.length) continue;

    for (const r of RULES) {
      let hit = null;
      for (const a of added) {
        r.re.lastIndex = 0;
        const m = r.re.exec(a.text);
        if (m) { hit = { file: a.file, raw: m[0] }; break; }
      }
      if (!hit) continue;
      const raw = hit.raw;
      const masked = raw.slice(0, 8) + "****" + raw.slice(-4);
      console.log("##PUSHBLOCK|" + c.slice(0, 8) + "|" + localRef + "|" + hit.file + "|" + r.name + "|" + masked + "|" + remote);
      blocked = true;
    }
  }
}

console.log("##PUSHSCANNED|" + scanned);

if (blocked) {
  console.error("\\nPush cancelled - a commit being uploaded adds a credential.");
  console.error("  1. ROTATE it now if it is real. It is not on the remote yet - that is the good news.");
  console.error("  2. Amend or revert the commit, then push again:");
  console.error("       git log --oneline -5");
  console.error("       git rebase -i HEAD~5");
  console.error("  3. False positive? git push --no-verify");
  process.exit(1);
}
console.log("Push allowed - " + scanned + " commit(s) scanned, nothing found.");
process.exit(0);
`;
}
function installPushCmd(hook, dir){
  return `# 1. go to the project you want to protect
cd /path/to/your/project

# 2. write the hook
mkdir -p ${dir}
cat > ${dir}/pre-push <<'GUARD_HOOK'
${hook}
GUARD_HOOK

# 3. make it executable
chmod +x ${dir}/pre-push
${dir===".githooks"?`
# 4. point git at it, and commit it so teammates get it too
git config core.hooksPath .githooks
git add .githooks/pre-push
git commit -m "Add pre-push secret guard"
`:`# 4. nothing else - this project is protected from the next push onward
`}`;
}

/* ---- read the hook's output back, same idea as the history scanner ---- */
function parsePush(text){
  const refs=[], blocks=[];
  let remote="", url="", scanned=null, version=null;
  String(text||"").split(/\r?\n/).forEach(l=>{
    let m;
    if((m=l.match(/^##PUSH\|([^|]*)\|([^|]*)\|(.*)$/))){ version=m[1]; remote=m[2]; url=m[3]; }
    else if((m=l.match(/^##PUSHREF\|([^|]*)\|([^|]*)\|([^|]*)\|(.*)$/))) refs.push({remote:m[1],ref:m[2],kind:m[3],detail:m[4]});
    else if((m=l.match(/^##PUSHBLOCK\|([^|]*)\|([^|]*)\|([^|]*)\|([^|]*)\|([^|]*)\|(.*)$/)))
      blocks.push({sha:m[1],ref:m[2],file:m[3],label:m[4],masked:m[5],remote:m[6]});
    else if((m=l.match(/^##PUSHSCANNED\|(\d+)$/))) scanned=parseInt(m[1],10);
  });
  return {version,remote,url,refs,blocks,scanned};
}
function pushReportHtml(){
  const raw=DB.get("pushOut","");
  const p=parsePush(raw);
  if(!raw.trim()) return `<div class="note">Paste the push output above and the verdict appears here — including what to do next.</div>`;
  if(p.version===null && !p.refs.length && !p.blocks.length)
    return `<div class="note warn">Nothing recognised in that output. The hook prints <code class="mono">##PUSH|v1|…</code> on its first line — copy the whole block, markers included.</div>`;

  const n=p.blocks.length;
  const badCommits=[...new Set(p.blocks.map(b=>b.sha))];
  const headline=n
    ? (badCommits.length===1
        ? `Push cancelled — 1 commit would have uploaded ${n} credential${n===1?"":"s"}.`
        : `Push cancelled — ${badCommits.length} commits would have uploaded ${n} credential${n===1?"":"s"}.`)
    : `Push allowed — ${p.scanned===null?"?":p.scanned} commit${(p.scanned||0)===1?"":"s"} scanned, nothing found.`;
  let html=`<div class="note ${n?"bad":"good"}">
    <b>${esc(headline)}</b>
    <div class="tiny" style="margin-top:5px">${n
      ? "Nothing was uploaded. The secret is still only on this machine, which is the good news — the remote never saw it."
      : "Every commit in this push was diffed line by line, not just the final state of the working tree."}</div>
  </div>`;

  if(p.refs.length){
    html+=`<div class="table-wrap" style="margin:14px 0"><table class="tb">
      <thead><tr><th>Ref</th><th>Kind</th><th>Result</th></tr></thead>
      <tbody>${p.refs.map(r=>`<tr>
        <td class="mono tiny">${esc(r.ref)}</td>
        <td><span class="pill">${esc(r.kind)}</span></td>
        <td class="tiny muted">${esc(r.detail)}</td>
      </tr>`).join("")}</tbody>
    </table></div>`;
  }

  if(n){
    html+=`<div class="grid" style="gap:10px">${p.blocks.map((b,i)=>{
      const where=ROTATE_WHERE[b.label];
      return `<div class="finding high">
        <div class="between">
          <div><b>${esc(b.file||"unknown file")}</b> <span class="pill bad">blocked</span></div>
          <span class="tiny dim mono">#${i+1}</span>
        </div>
        <div class="ft">${esc(b.masked)}</div>
        <div class="tiny muted" style="margin-top:6px">${esc(b.label)} · in commit <code class="mono">${esc(b.sha)}</code> on <code class="mono">${esc(b.ref)}</code></div>
        <div class="tiny" style="margin-top:7px"><b>If it is real, rotate it:</b> ${esc(where||"revoke this credential with its provider, then reissue it")}</div>
      </div>`;
    }).join("")}</div>`;

    html+=`<div class="note warn" style="margin-top:14px"><b>Clear the block, in this order.</b>
      <div class="tiny" style="margin-top:6px">
        1 · <code class="mono">git log --oneline -5</code> — find the commit the report names.<br>
        2 · <code class="mono">git rebase -i HEAD~5</code> and <code class="mono">drop</code> that line, or <code class="mono">git revert &lt;sha&gt;</code> if it is already shared.<br>
        3 · <code class="mono">git push</code> again.<br>
        4 · If the credential was real, rotate it. Removing the commit stops the upload; it does not un-ring the alarm.
      </div></div>`;
  }

  html+=`<div class="note" style="margin-top:14px"><b>Turning the guard off.</b> <code class="mono">git push --no-verify</code> skips it for one push, and <code class="mono">rm .git/hooks/pre-push</code> removes it entirely. Both work. Neither is a good idea on a repo you are about to make public.</div>`;
  return html;
}
function renderPush(){
  const el=$("#pushout"); if(!el) return;
  el.innerHTML=pushReportHtml();
}

/* ============================================================================
   4e. HISTORY SCANNER
   Reads every reachable blob in a repo's history, not just what is staged.
   Output is masked on purpose: a scan report that prints live secrets is a
   second copy of the problem it is reporting on.
   ========================================================================== */
function historyScript(){
  const all=Repos.map(r=>r.id);
  const sel=DB.get("bulkSel",null)||all;
  const repos=Repos.filter(r=>sel.indexOf(r.id)!==-1 && r.path);
  const paths=repos.map(r=>r.path).join("\n");
  return `#!/bin/sh
# ───────────────────────────────────────────────────────────────
#  History scanner - has a secret already been committed?
#  Generated by GitHub Command Center - github_manager/index.html
#
#  Reads every blob reachable in git history and reports credential
#  shapes it finds. Read-only: no checkout, no commit, no push.
#  Secrets are MASKED in the output, because a report that prints
#  live secrets is a second copy of the problem.
#
#  Runtime: reads every unique blob once. On a large history this
#  can take minutes. To bound it, set SINCE below, e.g.
#  SINCE="--since=1.year.ago"
# ───────────────────────────────────────────────────────────────
SINCE=""

TMPD=$(mktemp -d) || exit 1
trap 'rm -rf "$TMPD"' EXIT INT TERM
PAT="$TMPD/p"; LAB="$TMPD/l"; COMB="$TMPD/c"; BLOB="$TMPD/blob"; RES="$TMPD/res"

cat > "$PAT" <<'ENDPATTERNS'
${SHELL_RULES.map(r=>r[1]).join("\n")}
ENDPATTERNS

cat > "$LAB" <<'ENDLABELS'
${SHELL_RULES.map(r=>r[0]).join("\n")}
ENDLABELS

# pair each label with its pattern so a hit can name the credential type
awk -F'~' 'NR==FNR{a[FNR]=$1; next} {print a[FNR]"~"$1}' "$LAB" "$PAT" > "$COMB"

cat > "$TMPD/repos" <<'ENDREPOS'
${paths}
ENDREPOS

printf '##HISTORY v1\\n'
: > "$RES"
REPORTS=0; TOTAL=0

while IFS= read -r raw; do
  [ -n "$raw" ] || continue
  p="$raw"
  case "$p" in
    "~")   p="$HOME" ;;
    "~/"*) rr=$(printf '%s' "$p" | cut -c3-); p="$HOME/$rr" ;;
  esac
  name=$(basename "$p")

  if [ ! -d "$p/.git" ]; then
    printf '##SCAN|%s|FAIL|not a git repository\\n' "$name"; continue
  fi
  cd "$p" || continue
  REPORTS=$((REPORTS+1))

  ncommits=$(git rev-list --count $SINCE --all 2>/dev/null || echo 0)
  git rev-list --objects $SINCE --all > "$TMPD/objs" 2>/dev/null

  before=$(wc -l < "$RES" 2>/dev/null | tr -d ' ')
  hits=0
  seenobjs=$(awk '{print $1}' "$TMPD/objs" | sort -u)

  printf '%s\\n' "$seenobjs" > "$TMPD/uniq"
  while IFS= read -r sha; do
    [ -n "$sha" ] || continue
    git cat-file blob "$sha" > "$BLOB" 2>/dev/null || continue
    [ -s "$BLOB" ] || continue
    LC_ALL=C grep -qI . "$BLOB" 2>/dev/null || continue
    LC_ALL=C grep -Eqf "$PAT" "$BLOB" 2>/dev/null || continue

    path=$(grep "^$sha " "$TMPD/objs" 2>/dev/null | head -1 | cut -d' ' -f2-)
    [ -n "$path" ] || path="(unknown path)"
    headpath="$path"

    loginfo=$(git log --all --date=short --format='%ad' --find-object="$sha" 2>/dev/null)
    if [ -n "$loginfo" ]; then
      ncomm=$(printf '%s\\n' "$loginfo" | grep -c .)
      first=$(printf '%s\\n' "$loginfo" | tail -1)
    else
      ncomm="?"; first="unknown"
    fi

    headblob=$(git rev-parse "HEAD:$headpath" 2>/dev/null)
    if [ "$headblob" = "$sha" ]; then inhead=yes; else inhead=no; fi

    while IFS='~' read -r label pat; do
      [ -n "$pat" ] || continue
      if LC_ALL=C grep -Eq -- "$pat" "$BLOB" 2>/dev/null; then
        m=$(LC_ALL=C grep -aoE -m1 -- "$pat" "$BLOB" 2>/dev/null | head -1)
        [ -n "$m" ] || continue
        pre=$(printf '%s' "$m" | cut -c1-8)
        suf=$(printf '%s' "$m" | awk '{n=length($0); print (n>4)?substr($0,n-3):$0}')
        printf '##HIT|high|%s|%s|%s|%s|%s|%s|%s\\n' "$label" "$pre****$suf" "$path" "$ncomm" "$first" "$inhead" >> "$RES"
        hits=$((hits+1))
      fi
    done < "$COMB"
  done < "$TMPD/uniq"

  after=$(wc -l < "$RES" | tr -d ' ')
  repoHits=$((after - before))
  TOTAL=$((TOTAL + repoHits))
  if [ "$repoHits" -eq 0 ]; then
    printf '##SCAN|%s|OK|%s commits scanned, no credential shapes found\\n' "$name" "$ncommits"
  else
    printf '##SCAN|%s|HIT|%s commits scanned, %s finding(s)\\n' "$name" "$ncommits" "$repoHits"
  fi
  cd - >/dev/null 2>&1 || true
done < "$TMPD/repos"

cat "$RES"
printf '##TOTAL|%s|%s\\n' "$TOTAL" "$REPORTS"
printf '##HISTORYEND\\n'
`;

function parseHistory(text){
  const hits=[], scans=[];
  String(text||"").split(/\r?\n/).forEach(l=>{
    let m;
    if((m=l.match(/^##HIT\|([^|]*)\|([^|]*)\|([^|]*)\|([^|]*)\|([^|]*)\|([^|]*)\|([^|]*)\|([^|]*)$/)))
      hits.push({sev:m[1],label:m[2],masked:m[3],path:m[4],commits:m[5],first:m[6],inHead:m[7]});
    else if((m=l.match(/^##SCAN\|([^|]*)\|([^|]*)\|(.*)$/)))
      scans.push({repo:m[1],status:m[2],detail:m[3]});
    else if((m=l.match(/^##TOTAL\|([^|]*)\|([^|]*)$/)))
      scans.push({repo:"TOTAL",status:"TOTAL",detail:m[1]+" finding(s) across "+m[2]+" repo(s)"});
  });
  return {hits,scans};
}
function rotationList(parsed){
  const seen={};
  parsed.hits.forEach(h=>{
    const k=h.label+"|"+h.masked;
    if(!seen[k]) seen[k]={label:h.label,masked:h.masked,paths:new Set(),commits:new Set(),first:h.first,inHead:false,secrets:0};
    seen[k].paths.add(h.path);
    seen[k].commits.add(h.commits);
    seen[k].secrets++;
    if(h.inHead==="yes") seen[k].inHead=true;
  });
  return Object.values(seen).sort((a,b)=>{
    if(a.inHead!==b.inHead) return a.inHead?-1:1;
    return b.secrets-a.secrets;
  });
}

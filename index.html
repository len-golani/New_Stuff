function healthScript(){
  const ids=Accounts.map(a=>a.id);
  // fall back to the id so a missing host can never silently skip the checks
  const hosts=Accounts.map(a=>a.host||a.id).filter(Boolean);
  return `#!/bin/sh
# ───────────────────────────────────────────────────────────────
#  Two-account Git health check
#  Generated by GitHub Command Center - github_manager/index.html
#
#  Run it anywhere:   sh health-check.sh
#  Then paste the WHOLE output back into Health Check.
#  It only reads configuration and talks to GitHub over SSH.
#  It never writes, and never runs git commit or push.
# ───────────────────────────────────────────────────────────────
IDS="${ids.join(" ")}"
HOSTS="${hosts.join(" ")}"
[ -n "$HOSTS" ] || HOSTS="$IDS"

C() { printf '##CHECK %s|%s|%s\\n' "$1" "$2" "$3"; }
printf '##HEALTHCHECK v1\\n'

# 1. tools
if command -v git >/dev/null 2>&1; then
  C git.version OK "$(git --version 2>/dev/null)"
else
  C git.version FAIL "git is not on PATH"
fi
if command -v gh >/dev/null 2>&1; then
  C gh.version OK "$(gh --version 2>/dev/null | head -1)"
else
  C gh.version WARN "GitHub CLI not installed (optional)"
fi

# 2. ~/.ssh/config and the host aliases
SSHCFG="$HOME/.ssh/config"
if [ -f "$SSHCFG" ]; then
  C ssh.config OK "$SSHCFG exists"
  for hst in $HOSTS; do
    if grep -qE "^Host[[:space:]]+.*\\b$hst\\b" "$SSHCFG" 2>/dev/null; then
      C "ssh.host.$hst" OK "alias $hst declared"
    else
      C "ssh.host.$hst" FAIL "no Host alias '$hst' in ~/.ssh/config"
    fi
  done
else
  C ssh.config FAIL "~/.ssh/config does not exist"
  for hst in $HOSTS; do C "ssh.host.$hst" FAIL "~/.ssh/config missing"; done
fi

# 3. key pairs, and whether they carry a passphrase
for id in $IDS; do
  K="$HOME/.ssh/id_ed25519_$id"
  if [ -f "$K" ] && [ -f "$K.pub" ]; then
    C "key.$id" OK "key pair present"
    if ssh-keygen -y -P "" -f "$K" >/dev/null 2>&1 </dev/null; then
      C "passphrase.$id" WARN "private key has NO passphrase - treat it as compromised if the disk is ever copied"
    else
      C "passphrase.$id" OK "private key is passphrase-protected"
    fi
  else
    C "key.$id" FAIL "missing $K or $K.pub"
  fi
done

# 4. agent
if command -v ssh-add >/dev/null 2>&1; then
  if ssh-add -l >/dev/null 2>&1; then
    C ssh.agent OK "$(ssh-add -l 2>/dev/null | wc -l | tr -d ' ') key(s) loaded in the agent"
  else
    C ssh.agent WARN "agent is running but holds no keys"
  fi
else
  C ssh.agent WARN "ssh-add not available on this machine"
fi

# 5. the check that matters most: who does each alias actually answer as?
for hst in $HOSTS; do
  out=$(ssh -T -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new "git@$hst" 2>&1 </dev/null)
  case "$out" in
    *"successfully authenticated"*)
      who=$(printf '%s' "$out" | sed -n 's/.*Hi \\([^!]*\\)!.*/\\1/p')
      C "identity.$hst" OK "git@$hst authenticates as \${who:-unknown}"
      ;;
    *"Permission denied"*)
      C "identity.$hst" FAIL "git@$hst was refused - key not uploaded to that account, or the alias points at the wrong IdentityFile"
      ;;
    *"Could not resolve"*|*"not resolve"*)
      C "identity.$hst" FAIL "git@$hst is not a known host alias - ~/.ssh/config is missing the Host block"
      ;;
    *)
      C "identity.$hst" WARN "git@$hst gave an unexpected reply: $out"
      ;;
  esac
done

# 6. GitHub CLI accounts
if command -v gh >/dev/null 2>&1; then
  ghout=$(gh auth status 2>&1 | sed -n 's/.*Logged in to github.com account \\([^ (]*\\).*/\\1/p' | tr '\\n' ' ')
  if [ -n "$ghout" ]; then
    C gh.auth OK "logged in as: $ghout"
  else
    C gh.auth WARN "no GitHub accounts logged in - run: gh auth login (once per account)"
  fi
fi

# 7. global git config
[ -n "$(git config --global user.name 2>/dev/null)" ] \\
  && C git.user.name OK "$(git config --global user.name 2>/dev/null)" \\
  || C git.user.name WARN "no global user.name set"
[ -n "$(git config --global user.email 2>/dev/null)" ] \\
  && C git.user.email OK "$(git config --global user.email 2>/dev/null)" \\
  || C git.user.email WARN "no global user.email set"
[ "$(git config --global init.defaultBranch 2>/dev/null)" = "main" ] \\
  && C git.initbranch OK "init.defaultBranch = main" \\
  || C git.initbranch WARN "init.defaultBranch is $(git config --global init.defaultBranch 2>/dev/null || echo unset)"
[ "$(git config --global credential.useHttpPath 2>/dev/null)" = "true" ] \\
  && C git.credpath OK "credential.useHttpPath = true" \\
  || C git.credpath WARN "credential.useHttpPath is not true - only matters for two accounts over HTTPS"
if [ "$(git config --global core.autocrlf 2>/dev/null)" = "true" ]; then
  C git.autocrlf WARN "core.autocrlf=true rewrites every file to CRLF - whole-file diffs follow"
else
  C git.autocrlf OK "core.autocrlf=$(git config --global core.autocrlf 2>/dev/null || echo unset)"
fi

# 8. the guard, if run inside a project
if [ -x .git/hooks/pre-commit ]; then
  C guard OK "pre-commit guard installed and executable in this repo"
elif [ -f .git/hooks/pre-commit ]; then
  C guard WARN "pre-commit hook exists but is not executable - chmod +x .git/hooks/pre-commit"
elif [ -d .githooks ] || [ -n "$(git config --get core.hooksPath 2>/dev/null)" ]; then
  C guard OK "core.hooksPath is set to $(git config --get core.hooksPath 2>/dev/null)"
else
  C guard WARN "no pre-commit guard in this repo - see the Pre-Commit Guard tab"
fi

printf '##DONE\\n'
`;
}

function parseHealth(text){
  const out=[]; let saw=false;
  String(text||"").split(/\r?\n/).forEach(l=>{
    if(l.indexOf("##HEALTHCHECK")===0) saw=true;
    const m=l.match(/^##CHECK\s+([^|]+)\|([^|]*)\|(.*)$/);
    if(m) out.push({key:m[1].trim(), status:(m[2]||"").trim().toUpperCase(), detail:(m[3]||"").trim()});
  });
  return {rows:out, recognised:saw};
}

function localChecks(){
  const out=[];
  const push=(sev,label,fix)=>out.push({sev,label,fix});
  Accounts.forEach(a=>{
    if(!a.user) push("bad", `${a.label}: GitHub username is not set`, "Open Two-Account Setup and enter the username from your GitHub profile. Every generated remote URL depends on it.");
    if(!a.email) push("bad", `${a.label}: commit email is not set`, `Open Two-Account Setup and set an email for ${a.label}. Commits will otherwise be attributed to your global default.`);
  });
  const [p,w]=Accounts;
  if(p&&w){
    if(p.user && w.user && p.user.toLowerCase()===w.user.toLowerCase())
      push("bad","Both accounts have the same username","Two different accounts cannot share a username. Re-check what you entered in Two-Account Setup.");
    if(p.email && w.email && p.email.toLowerCase()===w.email.toLowerCase())
      push("warn","Both accounts share one commit email","GitHub will attribute every commit to the same account. Give each account its own verified email.");
    if(p.host===w.host)
      push("bad","Both accounts use the same host alias",`The aliases must differ, or Git cannot route them. Personal should be "${p.id}", work "${w.id}".`);
    if(p.user && w.user && p.user.toLowerCase()!==w.user.toLowerCase()){
      // expected - note the identity check on the machine is the real proof
    }
  }
  const seen={};
  Repos.forEach(r=>{
    if(!r.path) push("warn", `${r.label||r.name}: no folder path set`, "Add the absolute path so the generated scripts can cd into it.");
    const u=r.remoteUrl||"";
    if(/git@github\.com[:/]/.test(u))
      push("bad", `${r.label||r.name}: remote points at bare github.com`, "With two accounts that is ambiguous - git cannot tell which one it means. Switch it to the host alias, e.g. git@github-personal:user/repo.git.");
    if(/YOUR-USERNAME|USERNAME/.test(u))
      push("warn", `${r.label||r.name}: remote URL still contains a placeholder`, "Fill in your username on the repo, or the push will target a repository that does not exist.");
    if(!/^git@|^https:\/\//.test(u))
      push("warn", `${r.label||r.name}: remote URL looks malformed`, "A GitHub remote is either git@host:user/repo.git or an https:// URL.");
    const a=accById(r.account);
    if(a.host && u && u.indexOf(a.host)===-1 && u.indexOf("github.com")===-1)
      push("warn", `${r.label||r.name}: remote does not use the ${a.label} alias`, `This repo is filed under ${a.label} but its remote uses a different account's alias.`);
    if(u){ seen[u]=(seen[u]||[]).concat(r.label||r.name); }
  });
  Object.keys(seen).forEach(u=>{ if(seen[u].length>1) push("warn",`${seen[u].join(" and ")} share one remote`, "Two local folders tracking the same GitHub repo will fight each other on every pull. Keep one, or give the second a fork."); });
  if(!DB.get("gitignore",""))
    push("warn","No .gitignore has been generated here", "Tools > .gitignore builder. It is the single cheapest thing that stops a secret reaching a commit.");
  return out;
}

function explainCmd(raw){
  const s=raw.trim().replace(/\s+/g," ");
  const hit=EXPLAIN.find(e=>e.re.test(s));
  if(hit) return {title:hit.t, detail:hit.d, sample:hit.s};
  if(/^git\b/.test(s)) return {title:"Git command — not in the built-in dictionary", detail:"Git's official reference is git-scm.com/docs. Run 'git help <command>' locally, or ask me and I'll add it to the dictionary.", sample:"git help <command>"};
  return {title:"Not a git command", detail:"This doesn't look like a Git or GitHub CLI command. Check for typos, or that your terminal is inside a project folder with git installed.", sample:""};
}

  /* ---------- HEALTH CHECK ---------- */
  health(){
    const local=localChecks();
    const bad=local.filter(x=>x.sev==="bad").length;
    const warn=local.filter(x=>x.sev==="warn").length;
    const script=healthScript();
    const paste=DB.get("healthOut","");
    const parsed=parseHealth(paste);
    const rows=parsed.rows;
    const fails=rows.filter(r=>r.status==="FAIL").length;
    const warns=rows.filter(r=>r.status==="WARN").length;
    // the crown jewel: does each alias answer as the account you think it does?
    Accounts.forEach(a=>{
      const r=rows.find(x=>x.key==="identity."+a.host);
      if(!r || r.status!=="OK") return;
      const who=(r.detail.match(/authenticates as (.+)$/)||[])[1];
      if(who && a.user && who.toLowerCase()!==a.user.toLowerCase())
        rows.push({key:"identity."+a.host, status:"FAIL",
          detail:`git@${a.host} answers as "${who}" but you recorded this account as "${a.user}"`,
          mismatch:{who, expected:a.user}});
    });
    const totalFails=fails+rows.filter(r=>r.mismatch).length;
    return `
    <div class="hero" style="padding:44px 0 34px">
      <p class="eyebrow">Audit · two accounts</p>

    <p class="muted">These need nothing from you. They are consistency checks against the accounts and repositories you recorded here.</p>

    </div>

    <div class="grid g2" style="margin-top:14px">
      ${codeBlock(script, "health-check.sh · copy to a file and run: sh health-check.sh")}

    return `

      <p>Browsers have no access to your filesystem or your Git index, so nothing in this app can veto a <code class="mono">git commit</code>. What it does instead is generate a real pre-commit hook and hand you the exact commands to install it. Once installed, <b>your terminal</b> does the blocking — on every commit, forever, with no app open. That is the honest boundary.</p>
    </div>

    <h3 class="sec" id="install"><span class="bar"></span>1 · Pick how to install</h3>
    <div class="section-head">
      <div><p class="eyebrow">Step one</p><h2>Per project, or shared with the team.</h2></div>
      <p>Both do the same job. Option B is better if you work with others, because the hook travels in the repository instead of living on your disk alone.</p>
    </div>
    <div class="grid g2">
      <article class="card">
        <span class="label">Option A · personal</span>
        <h3>Straight into .git/hooks</h3>
        <p>One command, no config changes. Works immediately. It lives only on this machine and is lost if you re-clone the repo.</p>
        ${codeBlock(installCmd(sh, ".git/hooks"), "Option A · shell hook")}
      </article>
      <article class="card">
        <span class="label">Option B · shared</span>
        <h3>.githooks + core.hooksPath</h3>
        <p>Git looks for hooks here instead of .git/hooks, and the folder is committed — so every clone, including your teammate's, is protected automatically.</p>
        ${codeBlock(installCmd(sh, ".githooks"), "Option B · shell hook")}
      </article>
    </div>

    <div class="note warn" style="margin-top:14px">
      <b>Prefer the Node hook if you already use Node.</b> It runs the app's full ${SCAN_RULES.length} rule set, including the ones POSIX regex cannot express (word boundaries and lazy matching). The shell hook is the portable subset — it runs anywhere Git runs, including Windows Git Bash, which ships no Node or Python.
    </div>
    <div class="grid g2" style="margin-top:14px">
      ${codeBlock(installCmd(nd, ".githooks"), "Option B · node hook")}
      ${codeBlock(installCmd(nd, ".git/hooks"), "Option A · node hook")}
    </div>

    <h3 class="sec" id="proof"><span class="bar"></span>2 · Prove it actually blocks</h3>
    <p class="muted">Never trust a guard you have not seen fire. These four commands stage a fake token, watch the commit get cancelled, then clean up without touching your history.</p>
    ${codeBlock(`# 1. stage something that must not be committed
echo 'ghp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' > leak-test.txt
git add leak-test.txt

# 2. try to commit - the hook MUST refuse
git commit -m "this should be blocked"

# 3. clean up (nothing was committed, so your history is untouched)
git restore --staged leak-test.txt
rm leak-test.txt

# 4. confirm you are still clean
git status`,"Self-test")}
    <div class="note good" style="margin-top:12px">Expected output at step 2: <code class="mono">BLOCKED &nbsp;leak-test.txt</code> followed by <code class="mono">GitHub token line 1</code>, and <code class="mono">Commit cancelled</code>. If the commit succeeds, the hook is not installed or is not executable — check step 3.</div>

    <h3 class="sec" id="dryrun"><span class="bar"></span>3 · Dry run before you install</h3>
    <p class="muted">Paste real file content below. This runs the <b>exact</b> rule set the Node hook uses, so you can see what the hook would do without installing anything.</p>
    <div class="field" style="margin-top:12px">
      <textarea id="guardtext" rows="6" data-help="guard-in" data-lab="File content to test" placeholder="DATABASE_URL=postgres://user:hunter2@host:5432/app&#10;STRIPE_KEY=sk_live_…" oninput="guardDryRun()"></textarea>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="pri" data-help="guard-run" data-lab="Run the hook rules" onclick="guardDryRun()">Run the hook rules</button>
      <button class="ghost" data-help="guard-shell" data-lab="Check shell-hook subset" onclick="guardShellCheck()">Check against the shell-hook subset</button>
      <button class="ghost" data-help="clear" data-lab="Clear" onclick="document.getElementById('guardtext').value='';document.getElementById('guardout').innerHTML=''">Clear</button>
    </div>
    <div id="guardout" style="margin-top:14px"></div>

    <h3 class="sec" id="rules"><span class="bar"></span>4 · What each hook catches</h3>
    <div class="grid g2">
      <div class="card">
        <h4 style="margin-top:0">Node hook — full rule set</h4>
        <p class="tiny muted">Every rule the in-app scanner has.</p>
        <div class="table-wrap"><table class="tb">
          <thead><tr><th>Detects</th><th>Severity</th></tr></thead>
          <tbody>${SCAN_RULES.map(r=>`<tr><td>${esc(r.name)}</td><td><span class="st ${r.sev==="high"?"none":"preview"}">${r.sev}</span></td></tr>`).join("")}</tbody>
        </table></div>
      </div>
      <div class="card">
        <h4 style="margin-top:0">Shell hook — portable subset</h4>
        <p class="tiny muted">No Node needed. Word-boundary and filename rules are not included.</p>
        <div class="table-wrap"><table class="tb">
          <thead><tr><th>Detects</th><th>Pattern</th></tr></thead>
          <tbody>${SHELL_RULES.map(([n,p])=>`<tr><td>${esc(n)}</td><td class="mono tiny">${esc(p)}</td></tr>`).join("")}</tbody>
        </table></div>
      </div>
    </div>

    <h3 class="sec" id="push"><span class="bar"></span>5 · The second line of defence: pre-push</h3>
    <div class="section-head">
      <div><p class="eyebrow orange">Catches what slipped through</p><h2>Check every commit on its way out.</h2></div>
      <p>The commit guard only sees what you stage <i>right now</i>. This one sees every commit the push is about to upload, one diff at a time.</p>
    </div>
    <div class="callout">
      <strong>Same honest boundary, one step further out.</strong>
      <p>A browser cannot intercept a <code class="mono">git push</code> any more than it can intercept a commit. So this page generates a real <code class="mono">pre-push</code> hook and hands you the commands. Once installed, <b>your terminal</b> cancels the push — with no app open, on every push, forever.</p>
    </div>

    <h4 style="margin-top:18px">Why you want both</h4>
    <div class="grid g3" style="margin-top:10px">
      <div class="step">
        <h4>Pre-commit is easy to route around</h4>
        <p class="why">A flag, a GUI client, or one commit made before you installed the hook. Each is a hole, and none of them announce themselves.</p>
      </div>
      <div class="step">
        <h4>Pre-push looks at history, not files</h4>
        <p class="why">It reads the <i>added lines of every commit in the range being uploaded</i>. A secret added in March and deleted in April is still caught, because March is still in what you are about to send.</p>
      </div>
      <div class="step">
        <h4>The last chance before it is public</h4>
        <p class="why">Once the push lands, every clone on the planet has it. A cancelled push costs you one command; a leaked token costs you a rotation and a post-mortem.</p>
      </div>
    </div>

    <h4 style="margin-top:20px">What git hands the hook, and what it does with it</h4>
    <div class="table-wrap" style="margin-top:10px"><table class="tb">
      <thead><tr><th>Step</th><th>What happens</th></tr></thead>
      <tbody>
        <tr><td style="white-space:nowrap"><b>1 · stdin</b></td><td class="tiny muted">Git sends one line per ref being updated: <code class="mono">&lt;local ref&gt; &lt;local sha&gt; &lt;remote ref&gt; &lt;remote sha&gt;</code>. Nothing else. No filenames, no diff.</td></tr>
        <tr><td style="white-space:nowrap"><b>2 · range</b></td><td class="tiny muted">A new branch means <code class="mono">&lt;sha&gt; --not --remotes</code>; an update means <code class="mono">&lt;remote sha&gt;..&lt;local sha&gt;</code>. That is the exact set of commits about to be uploaded.</td></tr>
        <tr><td style="white-space:nowrap"><b>3 · diff</b></td><td class="tiny muted">For each commit, <code class="mono">git show --unified=0</code> is filtered down to <b>added lines only</b>, tagged with the file they came from. Removed lines are ignored on purpose — the secret is not being uploaded, you are taking it away.</td></tr>
        <tr><td style="white-space:nowrap"><b>4 · match</b></td><td class="tiny muted">The same ${SHELL_RULES.length} POSIX rules as the shell commit guard. Only added lines, only in the range, only for this push.</td></tr>
        <tr><td style="white-space:nowrap"><b>5 · verdict</b></td><td class="tiny muted">Any hit and the hook exits <code class="mono">1</code>, which cancels the whole push. Nothing is uploaded — not even the clean ref in a multi-ref push.</td></tr>
      </tbody>
    </table></div>
    <div class="note" style="margin-top:12px"><b>It prints machine-readable markers.</b> <code class="mono">##PUSH</code>, <code class="mono">##PUSHREF</code>, <code class="mono">##PUSHBLOCK</code> and <code class="mono">##PUSHSCANNED</code> — so you can paste the output below and get a verdict here instead of squinting at a terminal. Secrets are masked in the markers; the raw value is never echoed back.</div>

    <h4 style="margin-top:20px">Install it</h4>
    <div class="grid g2" style="margin-top:10px">
      <article class="card">
        <span class="label">Option A · personal</span>
        <h3>Into .git/hooks</h3>
        <p>Same as the commit guard. Lives on this machine only.</p>
        ${codeBlock(installPushCmd(psh, ".git/hooks"), "Option A · shell pre-push")}
      </article>
      <article class="card">
        <span class="label">Option B · shared</span>
        <h3>Into .githooks</h3>
        <p>Committed, so every clone gets it. The command sets <code class="mono">core.hooksPath</code> and commits the folder for you — without that, git would ignore the hook entirely.</p>
        ${codeBlock(installPushCmd(psh, ".githooks"), "Option B · shell pre-push")}
      </article>
    </div>
    <div class="grid g2" style="margin-top:14px">
      ${codeBlock(installPushCmd(pnd, ".githooks"), "Option B · node pre-push")}
      ${codeBlock(installPushCmd(pnd, ".git/hooks"), "Option A · node pre-push")}
    </div>
    <div class="note warn" style="margin-top:14px"><b>The push guard only ever uses the portable subset.</b> There is no "full rule set" version of it, because the rules that need word boundaries and lazy matching behave differently once they are run against a joined multi-line diff — they produce false positives, and a guard that cries wolf gets switched off. ${SHELL_RULES.length} high-signal rules, no cleverness. Use the Node variant only if you want the faster diffing, not more coverage.</div>

    <h4 style="margin-top:20px">Prove it fires</h4>
    <p class="muted tiny" style="margin-top:4px">This deliberately commits a fake token with <code class="mono">--no-verify</code> to slip past the commit guard, then watches the push guard catch what the commit guard missed.</p>
    ${codeBlock(`# 1. slip a fake token past the commit guard on purpose\necho 'ghp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' > leak-test.txt\ngit add leak-test.txt\ngit commit --no-verify -m "sneaky"

# 2. try to push - the pre-push guard MUST refuse\ngit push

# 3. clean up (the push was cancelled, so your history is untouched)\ngit reset --hard HEAD~1`,"Self-test")}
    <div class="note good" style="margin-top:12px">Expected at step 2: <code class="mono">##PUSHBLOCK|…|leak-test.txt|GitHub token|…</code>, then <code class="mono">Push cancelled</code>, then <code class="mono">error: failed to push some refs</code>. If the push succeeds, the hook is missing or not executable — check <code class="mono">ls -l .git/hooks/pre-push</code>.</div>

    <h4 style="margin-top:20px">Paste the output</h4>
    <div class="field" style="margin-top:10px">
      <label class="fl">Push output, markers included</label>
      <textarea id="pushin" rows="8" data-help="push-in" data-lab="Push output" placeholder="##PUSH|v1|origin|git@github.com:you/repo.git&#10;##PUSHREF|origin|refs/heads/main|update|1 commit(s)&#10;##PUSHBLOCK|d12d8841|refs/heads/main|app.sh|GitHub token|ghp_aaaa****aaaa|origin&#10;##PUSHSCANNED|1" oninput="DB.set('pushOut',this.value);renderPush()">${esc(DB.get("pushOut",""))}</textarea>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="pri" data-help="push-analyse" data-lab="Analyse push" onclick="DB.set('pushOut',document.getElementById('pushin').value);render()">Analyse push</button>
      <button class="ghost" data-help="clear" data-lab="Clear" onclick="document.getElementById('pushin').value='';DB.set('pushOut','');renderPush()">Clear</button>
    </div>
    <div id="pushout" style="margin-top:14px">${pushReportHtml()}</div>

    <div class="split" style="margin-top:18px">
      <div class="note bad">
        <b>It is not a substitute for the commit guard.</b>
        <p class="tiny">A blocked push is an interruption, not a workflow. Cancelling at push time means untangling history to get the push through, which is a worse experience than being stopped at <code class="mono">git commit</code> while the change is still fresh. Install both; let the commit guard be the one you actually feel.</p>
      </div>
      <div class="note warn">
        <b>It costs time on large pushes.</b>
        <p class="tiny">Every commit in the range is diffed individually. Pushing a branch with thousands of commits takes noticeably longer. On a big first push this can run for minutes, and there is no way to see progress. If that is unacceptable, use the commit guard alone and accept the <code class="mono">--no-verify</code> hole.</p>
      </div>
    </div>

    <h3 class="sec" id="limits"><span class="bar"></span>6 · Where it will get it wrong</h3>
    <div class="split">
      <div class="note bad">
        <b>It will miss things.</b>
        <p class="tiny">Both hooks match known credential shapes. They will not catch a company-internal token format, a base64 blob, a key split across two lines, a password typed straight into a SQL string, or a secret you invented yourself. Treat them as a seatbelt, not proof.</p>
      </div>
      <div class="note warn">
        <b>It will sometimes cry wolf.</b>
        <p class="tiny">Documentation, fixtures and test data legitimately contain fake keys. A <code class="mono">sk_test_</code> string in your own README will be flagged at commit time. Use <code class="mono">git commit --no-verify</code> for those, or narrow the rule rather than deleting the hook.</p>
      </div>
    </div>
    <div class="note" style="margin-top:12px"><b>One blind spot both guards share.</b> A secret typed straight into a commit <i>message</i> — <code class="mono">git commit -m "key is ghp_…"</code> — is invisible to both, because neither hook scans the message. That is the same reason the history scanner exists in section 7.</div>

    <h3 class="sec" id="history"><span class="bar"></span>7 · Scan the history you already have</h3>
    <div class="section-head">
      <div><p class="eyebrow orange">Retrospective</p><h2>Has a secret already been committed?</h2></div>
      <p>The guard only protects future commits. This reads every blob your history still holds and tells you which credentials to rotate.</p>
    </div>
    <div class="callout">
      <strong>If it finds something, rotate the credential first. Purging history is cleanup, not a fix.</strong>
      <p>Deleting the file does nothing: the blob stays reachable, every clone carries it, and anyone who already cloned has it. Revoking the key takes two minutes and is the only action that actually closes the hole. Treat any repo that has ever been public as already compromised.</p>
    </div>

    ${Repos.filter(r=>r.path).length===0 ? `<div class="note">No tracked project has a folder path yet. Add them in <b>My Repositories</b> and this fills in automatically.</div>` : `
    <div class="row" style="margin:14px 0">
      <div class="tiny dim">Scans <b>${Repos.filter(r=>r.path).length}</b> tracked project(s) using the checkbox selection from the bulk installer below.</div>
    </div>
    ${codeBlock(historyScript(), "history-scan.sh · save as a file and run: sh history-scan.sh")}
    <div class="note warn" style="margin-top:12px"><b>Runtime.</b> Every unique blob is read once. A large history can take minutes — that is normal, not a hang. To bound it, set <code class="mono">SINCE="--since=1.year.ago"</code> near the top of the script. Secrets are <b>masked</b> in the report, because a scan that prints live secrets is a second copy of the problem.</div>
    `}

    <div class="field" style="margin-top:16px">
      <label class="fl">Paste the scan output</label>
      <textarea id="histin" rows="7" data-help="hist-in" data-lab="History scan output" placeholder="##HISTORY v1&#10;##SCAN|my-app|HIT|212 commits scanned, 2 finding(s)&#10;##HIT|high|GitHub token|ghp_abc****6789|.env|3|2024-02-11|yes&#10;##TOTAL|2|1&#10;##HISTORYEND" oninput="DB.set('histOut',this.value);renderHistory()">${esc(DB.get("histOut",""))}</textarea>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="pri" data-help="hist-analyse" data-lab="Analyse scan" onclick="DB.set('histOut',document.getElementById('histin').value);render()">Analyse scan</button>
      <button class="ghost" data-help="clear" data-lab="Clear" onclick="document.getElementById('histin').value='';DB.set('histOut','');renderHistory()">Clear</button>
    </div>
    <div id="histout" style="margin-top:14px">${historyReportHtml()}</div>

    <h3 class="sec" id="bulk"><span class="bar"></span>8 · Install across every tracked project</h3>
    <div class="section-head">
      <div><p class="eyebrow">Bulk action</p><h2>One script, every folder.</h2></div>
      <p>Same guard, applied to each project in your tracker. It reports per project and writes nothing until you switch the dry run off.</p>
    </div>
    ${Repos.filter(r=>r.path).length===0 ? `<div class="note">No tracked project has a folder path yet. Add them in <b>My Repositories</b> and this fills in automatically.</div>` : `
    <div class="grid g3" style="margin-bottom:14px">
      <div class="field"><label class="fl">Where to install</label>
        <select data-bulk="mode" data-help="bulk-mode" data-lab="Where to install">
          <option value="personal" ${DB.get("bulkMode","personal")==="personal"?"selected":""}>Personal · .git/hooks</option>
          <option value="shared" ${DB.get("bulkMode")==="shared"?"selected":""}>Shared · .githooks (committed)</option>
        </select>
        <p class="tiny dim" style="margin-top:6px">Any project that already sets <code class="mono">core.hooksPath</code> keeps its own setting — the script never overrides it.</p>
      </div>
      <div class="field"><label class="fl">Engine</label>
        <select data-bulk="engine" data-help="bulk-engine" data-lab="Engine">
          <option value="sh" ${DB.get("bulkEngine","sh")==="sh"?"selected":""}>Shell · no dependencies</option>
          <option value="node" ${DB.get("bulkEngine")==="node"?"selected":""}>Node · full ${SCAN_RULES.length}-rule set</option>
        </select>
        <p class="tiny dim" style="margin-top:6px">Every hook is syntax-checked before it is counted as installed.</p>
      </div>
      <div class="field"><label class="fl">Which hook</label>
        <select data-bulk="hook" data-help="bulk-hook" data-lab="Which hook">
          <option value="commit" ${DB.get("bulkHook","commit")==="commit"?"selected":""}>Pre-commit only</option>
          <option value="push" ${DB.get("bulkHook")==="push"?"selected":""}>Pre-push only</option>
          <option value="both" ${DB.get("bulkHook")==="both"?"selected":""}>Both · recommended</option>
        </select>
        <p class="tiny dim" style="margin-top:6px">Each one is installed and syntax-checked separately, and backed up independently.</p>
      </div>
      <div class="field"><label class="fl">Dry run</label>
        <select data-bulk="dry" data-help="bulk-dry" data-lab="Dry run">
          <option value="true" ${DB.get("bulkDry",true)!==false?"selected":""}>ON · report only</option>
          <option value="false" ${DB.get("bulkDry",true)===false?"selected":""}>OFF · actually install</option>
        </select>
        <p class="tiny dim" style="margin-top:6px">Read the report first. Then flip this to OFF and run again.</p>
      </div>
    </div>

    <div class="card pad0" style="margin-bottom:14px">
      <div class="table-wrap"><table class="tb">
        <thead><tr><th style="width:34px"></th><th>Project</th><th>Folder</th><th>Account</th></tr></thead>
        <tbody>${Repos.map(r=>{
          const on=(DB.get("bulkSel",null)||Repos.map(x=>x.id)).indexOf(r.id)!==-1;
          const bad=!r.path;
          return `<tr>
            <td><input type="checkbox" ${bad?"disabled":""} ${on?"checked":""} data-bulkproj="${r.id}" data-help="bulk-pick" data-lab="Include ${esc(r.label||r.name)}" style="width:auto"/></td>
            <td><b>${esc(r.label||r.name)}</b>${bad?` <span class="pill warn">no path</span>`:""}</td>
            <td class="mono tiny">${esc(r.path||"—")}</td>
            <td><span class="pill">${esc(accById(r.account).label)}</span></td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>
    </div>

    <div class="split" style="margin-bottom:14px">
      <div class="note good">
        <b>It will not destroy anything.</b>
        <p class="tiny">A hook you wrote yourself is copied to <code class="mono">pre-commit.bak</code> or <code class="mono">pre-push.bak</code> first, never overwritten. A guard that is already installed is left alone. A folder that is missing, or is not a git repository, is skipped with a reason.</p>
      </div>
      <div class="note warn">
        <b>Before you flip the dry run off.</b>
        <p class="tiny">Run it once with DRY=1 and read every line. ${bulkTargets().length?`It will touch <b>${bulkTargets().length}</b> project folder(s).`:"No projects are selected yet."} In shared mode it also runs <code class="mono">git config core.hooksPath</code> per repo and you should commit the new <code class="mono">.githooks</code> folder.</p>
      </div>
    </div>

    ${codeBlock(bulkScript(), "bulk-install.sh · save as a file and run: sh bulk-install.sh")}

    <div class="note" style="margin-top:14px"><b>Undo.</b> Remove a hook with <code class="mono">rm .git/hooks/pre-commit</code> or <code class="mono">rm .git/hooks/pre-push</code>, or restore the one you had with <code class="mono">mv .git/hooks/pre-commit.bak .git/hooks/pre-commit</code>. In shared mode also run <code class="mono">git config --unset core.hooksPath</code>.</div>
    `}

    <h3 class="sec" id="operate"><span class="bar"></span>9 · Running it day to day</h3>
    <div class="grid g2">
      <div class="card">
        <h4 style="margin-top:0">Check it is installed</h4>
        ${codeBlock(`ls -l .git/hooks/pre-commit        # personal (option A)\nls -l .git/hooks/pre-push          # the push guard\ngit config core.hooksPath          # shared (option B)\nls -l .githooks/`,"Verify")}
        <p class="tiny muted">A <code class="mono">-rw-r--r--</code> permissions line means the hook is not executable. Fix with <code class="mono">chmod +x</code>.</p>
      </div>
      <div class="card">
        <h4 style="margin-top:0">Turn it off, temporarily</h4>
        ${codeBlock(`# skip the hook for one action\ngit commit --no-verify -m "docs: add example token"\ngit push --no-verify origin main\n\n# disable one hook for the whole project\nchmod -x .git/hooks/pre-commit       # option A\nchmod -x .git/hooks/pre-push\n\n# turn it back on\nchmod +x .git/hooks/pre-commit\ngit config core.hooksPath .githooks`,"Disable / re-enable")}
      </div>
    </div>
    <div class="note" style="margin-top:14px">
      <b>What the guards cannot do for you.</b>
      <p>Neither can see a secret typed straight into a <code class="mono">git commit -m "message"</code>, neither catches a credential format invented inside your own company, and neither can help once a secret is on the remote — for that, rotate the credential first, then use the recovery steps in Lesson 8. A guard installed today does not clean yesterday. The push guard closes the "committed before the hook existed" hole, which the commit guard leaves open, but it opens a new one: it cannot run faster than the diff it has to read.</p>
    </div>`;
  },

  /* ---------- PRINT SHEET ---------- */
  print(){
    const acct=x=>`<div class="ps-acct"><b>${esc(x.label)}</b>
        <code>git@${esc(x.host)}:${esc(x.user||"USERNAME")}/repo.git</code>
        <div class="tiny dim">${esc(x.email||"commit email not set")}</div></div>`;
    const sec=(title,rows)=>`<section class="ps-sec"><h3>${esc(title)}</h3>
        <table class="ps-tb"><tbody>${rows.map(([c,d])=>`<tr><td><code>${esc(c)}</code></td><td>${esc(d)}</td></tr>`).join("")}</tbody></table></section>`;
    return `
    <div class="ps">
      <div class="ps-head">
        <div>

function handleFiles(files){
  if(!files.length) return;
  const out=[];
  let pending=files.length;
  const add=(name,text)=>{ out.push({name, findings:scanText(text,name)}); if(--pending<=0) renderFindings(out); };
  [...files].forEach(f=>{
    const r=new FileReader();
    r.onload=()=>add(f.name,String(r.result));
    r.onerror=()=>add(f.name,"");
    if(f.size>4*1024*1024) add(f.name,""); else r.readAsText(f);
  });

async function exportVault(){
  const data=localStorage.getItem("ghc:vaultData");
  const meta=localStorage.getItem("ghc:vaultMeta");
  if(!data||!meta) return toast("Vault is locked or empty","warn");
  // BOTH halves are required. vaultMeta holds the salt and the verifier;
  // without it the ciphertext can never be decrypted on any machine.
  const payload=JSON.stringify({format:"ghcvault/1", meta:JSON.parse(meta), data});
  const b=new Blob([payload],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download="vault-"+new Date().toISOString().slice(0,10)+".ghcvault"; a.click();
  URL.revokeObjectURL(a.href); toast("Encrypted vault exported","ok");
}

  a.href=URL.createObjectURL(b); a.download="tracker-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  URL.revokeObjectURL(a.href);
}
async function importVault(f){
  if(!f) return;
  const txt=await f.text();
  if(f.name.endsWith(".ghcvault")){
    let j=null;
    try{ j=JSON.parse(txt); }catch(e){}
    if(!j || j.format!=="ghcvault/1" || !j.meta || !j.data)
      return modal("This backup cannot be restored",
        `<div class="note bad"><b>The file is missing the encryption salt.</b>
         <p style="margin:6px 0 0">A vault needs two halves: the encrypted data, and the salt that derives the key from your master password. This file has only one of them, so the data can never be decrypted &mdash; on this machine or any other. Nothing has been written to this browser.</p></div>
         <div class="note" style="margin-top:12px"><b>What to do.</b>
         <p style="margin:6px 0 0">Older versions of this app exported only the encrypted half, so any backup taken before now is affected and cannot be recovered. Re-create the vault here and re-export it.</p></div>`,
        [{t:"Close",cls:"pri",fn:closeModal}]);
    localStorage.setItem("ghc:vaultMeta", JSON.stringify(j.meta));
    localStorage.setItem("ghc:vaultData", j.data);
    toast("Vault restored — now unlock it with your master password","ok",4200);
    Vault.prompt();
  } else {
    const j=JSON.parse(txt);
    if(j.accounts) DB.set("accounts",j.accounts);
    if(j.repos) DB.set("repos",j.repos);
    if(j.done) DB.set("done",j.done);
    if(j.gitignore) DB.set("gitignore",j.gitignore);
    toast("Tracker data restored","ok"); render();
  }
}
function wipeAll(){

    [{t:"Cancel",fn:closeModal},{t:"Yes, wipe it all",cls:"danger",fn:()=>{DB.wipe();location.reload()}}]);
}

function modal(title,html,buttons=[]){
  closeModal();
  MODAL_ACTIONS={};
  /* A label with no dictionary entry gets a sentence that cannot be wrong.
     Guessing "closes the dialog" on a Save button would be a lie. */
  const helpFor = t => {
    const k = MODAL_HELP[t];
    if(k) return k;
    const g = "modal~"+t;
    HELP[g] = "Runs the “"+t+"” action in the “"+title+"” pop-up, then closes it.";
    return g;
  };
  const bg=document.createElement("div");
  bg.className="modal-bg"; bg.id="mbg";
  bg.innerHTML=`<div class="modal"><div class="mh"><b>${title}</b><button class="sm ghost" onclick="closeModal()" data-help="m-close" data-lab="Close">✕</button></div>
    <div class="mb">${html}</div>
    ${buttons.length?`<div class="mf">${buttons.map((b,i)=>{
        if(b.fn) MODAL_ACTIONS[i]=b.fn;
        return `<button class="${b.cls||""}" id="${b.id||""}"${b.fn?` data-act="${i}"`:""} data-help="${b.h||helpFor(b.t)}" data-lab="${esc(b.t)}">${b.t}</button>`;
      }).join("")}</div>`:""}</div>`;
  bg.addEventListener("mousedown",e=>{if(e.target===bg)closeModal()});
  document.body.appendChild(bg);
}
function closeModal(){ const m=document.getElementById("mbg"); if(m) m.remove(); }

async function saveVaultItem(id){
  const v={id:id||uid(),label:$("#v_label").value.trim()||"credential",type:$("#v_type").value,
    account:$("#v_account").value,user:$("#v_user").value.trim(),secret:$("#v_secret").value,
    notes:$("#v_notes").value.trim(),updated:Date.now()};
  if(!v.secret) return toast("Secret can't be empty","bad");
  const arr=(await Vault.items())||[];
  const i=arr.findIndex(x=>x.id===v.id);

async function delVault(id){
  if(!confirm("Delete this credential from the vault?")) return;
  const arr=(await Vault.items())||[];
  await Vault.save(arr.filter(x=>x.id!==id)); paintVault(); toast("Deleted","ok");

let revealTimer=null;

  const arr=(await Vault.items())||[]; const it=arr.find(x=>x.id===id); if(!it) return;

  el.textContent = el.textContent.startsWith("•") ? it.secret : "••••••••••••••••";
  clearTimeout(revealTimer);
  revealTimer=setTimeout(()=>{ if(el) el.textContent="••••••••••••••••"; },15000);
}

function filterCheat(v){
  DB.set("cheatQ",v);

    const sec=document.getElementById("cg_"+g.g.replace(/\W/g,""));

    box.style.display = rows.length?"":"none";
    box.innerHTML=`<table class="tb"><tbody>${rows.map(([c,d])=>{ const cid="cf_"+uid(); COPIES[cid]=c; return `<tr>

      <td>${esc(d)}</td></tr>`; }).join("")}</tbody></table>`;
  });

function globalSearch(q){
  if(!q.trim()) return;
  const s=q.toLowerCase();
  const hits=[];
  CHEAT.forEach(g=>g.c.forEach(([c,d])=>{if((c+d).toLowerCase().includes(s))hits.push(["ref",c,d])}));
  LESSONS.forEach((l,i)=>{if((l.t+l.d).toLowerCase().includes(s))hits.push(["learn",l.t,l.d])});
  EXPLAIN.forEach(e=>{if((e.t+e.detail).toLowerCase().includes(s))hits.push(["tools",e.t,e.detail])});
  if(hits.length<2){ $("#gsearch").style.borderColor="var(--ac2)"; }
}

const PROJECT_TREE=`~/projects/
├── personal/                 ← your PERSONAL GitHub account
│   ├── portfolio-site/       ← one folder = one repo, always
│   ├── dotfiles/
│   └── experiments/
└── work/                     ← your WORK GitHub account
    ├── client-tool/
    └── internal-api/

Each project folder:
  my-app/
  ├── .git/            ← created by git init. NEVER delete casually.
  ├── .gitignore       ← secrets + build junk
  ├── .env.example     ← committed, empty values
  ├── .env             ← gitignored, real values
  └── (your source files)

Rule: if a folder has a .git, it is a repo. If it doesn't, it's just a folder.
NEVER put two projects inside one repo — it makes them impossible to
push to different accounts and impossible to share separately.`;

const UNDO_SCRIPT=`# ── 1. Look before you leap ───────────────────
git status                    # what is going on right now?
git log --graph --oneline --all
git reflog                    # every state you have ever been in

# ── 2. Un-stage a file (keeps it on disk) ────────
git restore --staged <file>

# ── 3. Undo the last commit (keeps changes) ──────
git reset --soft HEAD~1

# ── 4. Shelve work in progress ───────────────────
git stash push -m "wip"
git stash list
git stash pop

# ── 5. Escape a broken merge ─────────────────────
git merge --abort
git cherry-pick --abort
git rebase --abort

# ── 6. Time travel to a previous commit ──────────
git reflog                                   # find the hash you want
git reset --hard <hash>

# ── 7. Revert a shared commit safely ────────────
git revert <commit-hash>

# ── 8. Deleted a branch by mistake? ─────────────
git reflog | grep "branch: Created"  # or just:
git checkout -b feature/x <hash-from-reflog>

# ── 9. Pushed something you shouldn't have? ──────
git push --force-with-lease origin main
# (refuses to overwrite work pushed by someone else)`;

});
